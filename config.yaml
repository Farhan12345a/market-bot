trading:
  # --- Entry signal parameters ---
  # Entry decisions are made by watching each screened candidate's price DURING
  # the entry window below (not at one single instant anymore). If a symbol's
  # price rises by at least `rapid_increase_pct` within any trailing
  # `rapid_increase_lookback_minutes` window, it is bought.
  # Raised 09:30 -> 09:35. On 2026-08-19 entries in the 9:34 and 9:46 bursts
  # went 1 win / 30 trades for -$1,884, while entries from 9:51 onward went
  # 6 wins / 12 trades for +$356. In the opening minutes nearly every
  # high-beta name clears rapid_increase_pct at once, so the signal selects
  # "the market opened" rather than any individual stock's strength.
  entry_window_start: "09:35"        # Start watching candidates for a rapid price rise (HH:MM ET)
  entry_window_end: "09:55"          # Stop looking for NEW entries after this time (HH:MM ET). Widened from 09:45.
  # --- Real-time price stream ---
  # Alpaca's free tier delays the REST historical endpoint by ~15 minutes but
  # carries the same IEX data LIVE over the WebSocket - a delivery-mechanism
  # difference, not a data-tier one, so this needs no plan upgrade. Every
  # entry/exit decision used to read REST-delayed prices, which is why
  # rapid_increase_lookback_minutes had to be widened from 2 to 5 (a window
  # shorter than the feed lag can never accumulate two in-window samples).
  # It also removes one REST call per symbol per poll - 57 round-trips a cycle
  # on a 57-symbol watchlist.
  # If the stream drops or has no fresh bar for a symbol, that read falls back
  # to REST automatically, so turning this off (or a stream failure) simply
  # restores the previous behavior.
  # OFF for 2026-08-20. The stream is built, tested (87 cases) and safe to
  # enable - it falls back to REST per symbol and a watchdog abandons it
  # entirely after 120s of silence - but its live connection has never been
  # verified against Alpaca from the production host, and this session is
  # already carrying the ET/UTC clock fix, the position-set reconciliation,
  # the daily entry cap, equity-based sizing, the resistance floor, the
  # re-entry cooldown and a daily-loss limit that now actually fires. Those
  # target confirmed losses; this one is a latency optimization. Enabling it
  # the same day would make an unexpected result impossible to attribute.
  # Flip to true to turn the stream on - nothing else needs to change.
  use_websocket_stream: true

  # Alpaca's free/IEX feed caps subscriptions per connection. Going over does
  # NOT fail loudly: the socket connects, reports healthy, returns
  # "error: symbol limit exceeded (405)", and then delivers ZERO bars forever.
  # On 2026-08-21, 59 symbols were subscribed and the watchdog spent 120s
  # discovering the silence before falling back to REST for the whole session.
  #
  # Bars and trades count as SEPARATE subscriptions, so with
  # use_trade_ticks_for_entry on, 30 subscriptions = 15 symbols. Symbols beyond
  # the cap are not dropped from the watchlist - they simply get REST prices,
  # which is what every symbol used before the stream existed.
  #
  # Priority goes to the screener's picks and the day's earnings/QQQ adds; the
  # static universe fills whatever is left.
  stream_max_subscriptions: 28
  websocket_feed: "iex"   # iex = free tier. sip requires a paid subscription.

  # Subscribe to live TRADES as well as bars, and use the latest tick as the
  # price for ENTRY DETECTION. Exits keep reading 1-minute bar closes.
  # The split is deliberate. Entries want speed: on 2026-08-20 losing entries
  # landed at the 87th percentile of the surrounding half-hour while winners
  # landed at the 43rd - losers were systematically buying the local top, which
  # is what acting on delayed prices looks like. Exits want stability:
  # RESISTANCE fired 14 times that day on moves as small as 0.08%, so putting
  # ticks into the exit path would undo that fix.
  # Consequence: a bad print can only cause a missed or slightly-early ENTRY.
  # It can never stop out a good position.
  # Requires use_websocket_stream; ignored otherwise, and falls back to the bar
  # close whenever no trade has arrived in the last 30s.
  use_trade_ticks_for_entry: true

  entry_check_interval_seconds: 60   # How often to re-check prices during the entry window, in seconds.
                                      # Kept at 60s (matches the 1-minute bar data we fetch) - polling faster
                                      # than that just re-reads the same bar and burns Alpaca's free-tier
                                      # data-request quota for no benefit.
  # 0.5%/5min -> 0.3%/3min for 2026-08-21, moved TOGETHER and only because the
  # WebSocket is on. Holding 0.5% while shortening the window would demand a
  # FASTER move, selecting harder-running names - and the 2026-08-19 data says
  # that is backwards (signal >= 1.0%: 6 symbols, 1 winner, -$531; signal
  # < 1.0%: 14 symbols, 4 winners, -$181). 0.5% over 5min is ~0.3% over 3min,
  # so this holds the implied velocity constant while reacting sooner.
  # A shorter window is only useful on live data: with REST-delayed prices,
  # entry timing is dominated by feed lag, not window width.
  rapid_increase_pct: 0.3            # Minimum % price gain within the lookback window to trigger a buy
  rapid_increase_lookback_minutes: 3 # Rolling window, in minutes, that the % gain above is measured over.
                                      # Widened from 2min: the free IEX feed lags wall-clock by ~2-3min, and the
                                      # lookback cutoff is computed against wall-clock time, so a window shorter
                                      # than the feed delay could never accumulate 2 in-window samples (see the
                                      # wall-clock-cutoff fix in run_entry_window in main.py).

  # --- RSI pre-filter ---
  # Computed once per candidate at symbol-selection time (market open); would
  # gate entries on RSI < rsi_max_for_entry. Disabled: on the sharp opening-range
  # breakouts this strategy targets, RSI often shoots up through 50-70 as PART
  # of the move itself, so requiring RSI < 50 was filtering out exactly the
  # kind of aggressive breakout being chased. Left in place (off) rather than
  # removed in case it's wanted again later.
  use_rsi_filter: false
  rsi_period: 14        # Standard RSI lookback, in daily bars
  rsi_max_for_entry: 50 # Only watch candidates with RSI below this for entry signals

  # --- Pullback entry ---
  # Instead of buying the instant a rapid increase is detected (which can mean
  # buying right into the top of the initial thrust, just before a normal
  # pullback), wait for price to pull back off the peak and then resume
  # upward before actually entering - aims for a better average entry price
  # and avoids buying the exact local top of the spike.
  # OFF for now: this contradicts use_three_bar_momentum below in practice -
  # the cleanest, strongest thrusts (the ones that pass 3-bar momentum) are
  # exactly the moves this patient logic exists to NOT buy immediately, so
  # running both together meant the best-looking setups got the least
  # disciplined entry while choppier ones got the most. Toggle back on to
  # A/B test against the three-bar fast path.
  use_pullback_entry: false
  pullback_min_pct: 0.1              # Min retracement from the post-thrust peak (%) to count as "a pullback started"
  pullback_max_giveback_fraction: 0.75 # Invalidate the setup if the pullback erases more than this fraction of the thrust's gain (failed breakout)
  resumption_confirm_pct: 0.05       # Min bounce off the pullback low (%) to confirm resumption and actually buy

  # --- 3-bar momentum entry (fast path) ---
  # Checked ahead of the rapid_increase_pct/pullback logic above. Buys
  # IMMEDIATELY (no pullback-wait) the instant 3 consecutive 1-minute bars
  # are all green (close > open) with each bar's close higher than the last -
  # a faster, more aggressive confirmation than waiting for a % threshold to
  # accumulate over rapid_increase_lookback_minutes. Still gated by the RSI
  # filter above (if enabled). Runs alongside, not instead of, the signal below.
  # Independently toggleable from use_pullback_entry above so both can be
  # A/B tested separately.
  use_three_bar_momentum: true

  # Require the thrust to be ACCELERATING, not merely rising: each
  # close-to-close gap must be strictly bigger than the one before it.
  #   9.51 -> 9.55 -> 9.56  (gaps +0.04, +0.01)  rejected - move is stalling
  #   9.51 -> 9.53 -> 9.58  (gaps +0.02, +0.05)  accepted - still gaining speed
  # Both series rise, so the old "each close higher" test bought either one.
  # The first shape is a move that has largely already played out, which is
  # exactly what this fast-path signal should not be buying into.
  # Set false to go back to plain rising closes.
  three_bar_require_acceleration: true

  # --- Opening reversal (U-shape) entry ---
  # Catches the OPPOSITE pattern from every signal above: a stock that DROPS
  # at the open, bottoms out, then reverses upward - a U or V shaped
  # recovery. None of the other three entry paths can ever detect this,
  # since they all require an UPWARD move to even start watching a symbol.
  # OFF by default - new, unproven logic that hasn't run live even once yet.
  # Both the drop and the bounce are confirmed via consecutive-bar counting
  # (see _check_consecutive_bar_pattern) - the same "N clean bars in a row,
  # not just one tick" discipline use_three_bar_momentum already uses for
  # its up-signal, applied here in both directions.
  use_opening_reversal_entry: false
  opening_reversal_window_minutes: 5    # only watch for the INITIAL drop within this many minutes of market
                                         # open - an "opening dip" stops meaning anything once the morning's
                                         # well underway, so no new decline-tracking starts after this
  opening_reversal_drop_bars: 5         # consecutive red (declining) 1-min bars that counts as "a drastic
                                         # drop" worth watching (not just normal noise)
  opening_reversal_confirm_bars: 5      # consecutive green (rising) 1-min bars off the tracked low needed
                                         # to confirm the reversal is real and buy

  # volume_spike_multiplier: 1.5  # NOT CURRENTLY USED (kept here for reference).
  # The old entry check required a single 5-minute bar's volume to be >= 1.5x
  # a full TRADING DAY's average volume - a unit mismatch (5 minutes of volume
  # vs. ~390 minutes of average volume) that was almost never satisfiable.
  # Dropped in favor of the rapid_increase_* price-based check above.

  # --- Exit parameters ---
  # Checked in this priority order every exit-monitoring pass (~once per minute
  # live): final_exit > first_exit > momentum_fade > resistance > trailing_stop
  # > time_stop. The first one that fires wins for that pass.
  final_exit_loss_pct: -1.0    # Hard stop: sell ALL remaining shares if price falls this much from entry (%)
  first_exit_loss_pct: -0.5    # Scale-out: sell first_exit_pct of the position if price falls this much from entry (%)
  first_exit_pct: 0.33         # Fraction of the original position sold on the first_exit_loss_pct trigger above
  trailing_stop_pct: 0.75      # Trailing stop: exit ALL remaining shares if price falls this % below the
                                # HIGHEST price seen since entry (not below entry price - protects gains already made)
  time_stop_hour: 16           # Close all positions at this hour (ET) if nothing else has exited yet

  # Momentum fade: bails on a trade that's stalled (flat/negative trend) even
  # without a loss, rather than waiting for it to reverse into one.
  momentum_fade_hour: 10                 # Start checking momentum fade at this hour (ET)
  momentum_fade_minute: 15               # ...and this minute. Combined: 10:15 AM ET by default.
  momentum_fade_window_samples: 5        # Number of recent price samples used in the trend calc.
                                          # One sample is taken per exit-check pass (~once per minute
                                          # live), so 5 samples ~= the trend over the last ~4-5 minutes.
  # Loosened 0.0001 -> -0.05. At 0.0001 anything not strictly RISING counted as
  # fading: GRAB exited on a logged slope of exactly -0.000000, and NU - the
  # best trade of 2026-08-19 - was closed at +2.43% on a slope of -0.002.
  # At -0.05 a $50 stock must shed roughly a nickel a minute across the whole
  # sample window before this fires, i.e. an actual downtrend.
  momentum_fade_slope_threshold: -0.05   # Trend is considered "faded" (and the position is closed)
                                          # when the regression slope ($ per sample) drops to or below this.

  # Resistance rejection: a "high, then two lower closes" pattern right at the
  # trade's peak is treated as a failed breakout and exits.
  resistance_lookback_samples: 3   # Number of recent price samples checked for the failed-breakout
                                    # pattern (oldest sample = peak, must strictly decline from there)
  resistance_min_decline_pct: 0.3  # ...AND the drop off that peak must exceed this %. Without a floor
                                    # the "strictly declining" test is met by a single cent, so the rule
                                    # fired on noise inside the spread - it exited NFLX on -0.08%,
                                    # UBER on -0.11% and ASTS on -0.14% on 2026-08-19, 14 times in all.
                                    # Set 0 to restore the old no-floor behavior.

  # --- Re-entry cooldown ---
  # After a position closes AT A LOSS, refuse to buy that symbol again for
  # this many minutes. On 2026-08-19 the bot repeatedly stopped out and then
  # bought straight back into the same decline: RGTI -$340 over 4 exits,
  # MRVL -$328 over 3, CLSK -$238 over 4, PLUG -$137, UPST -$134.
  # Set 0 to disable.
  # Lowered from 20 to 5 on 2026-08-21. The cooldown exists to stop the bot
  # re-buying a name it just stopped out of while the same failed move is still
  # unwinding - real, but 20 minutes was sized for a 59-symbol watchlist where
  # there was always another candidate. With the stream capped to ~14 symbols,
  # a 20-minute lockout on a 20-minute entry window means one bad entry
  # retires that symbol for the entire session.
  #
  # NOT set to 0. On 2026-08-19 the bot re-entered the same losing names
  # repeatedly inside a few minutes; with reentry_cooldown_after_loss_only
  # true, this only ever gates a symbol that just LOST, and 5 minutes is
  # enough for the immediate post-stop churn to settle.
  reentry_cooldown_minutes: 5
  reentry_cooldown_after_loss_only: true  # false = cool down after ANY exit. Left true because
                                           # re-entering a name that just PAID was profitable that
                                           # day (UBER +$190 over 2, CHWY +$159 over 4, CMG +$109
                                           # over 2) - only the losing re-entries were the problem.

  # --- Position sizing ---
  # Each entry's dollar budget is the SMALLEST of three ceilings (see
  # _position_size in main.py); shares = budget / price, so a cheap stock
  # simply buys more shares for the same money. Share count is not itself a
  # risk measure - 780 shares of a $12 stock is the same $10k as 40 shares
  # of a $240 stock.
  #
  #   1. equity * max_total_exposure_fraction / max_concurrent_positions
  #      (even slot share - at ~$95k equity: 95000 * 0.9 / 10 = $8,550)
  #   2. equity * max_risk_per_trade_fraction / (final_exit_loss_pct/100)
  #      (largest position whose stop costs <= that fraction of equity)
  #   3. max_position_per_stock_usd (flat backstop)
  #
  # Sizing was previously just ceiling 3 alone - a flat $10,000 into every
  # name regardless of account size, which across 10 slots assumed $100,000
  # committed against ~$95,000 of equity.
  max_position_per_stock_usd: 10000  # Hard $ ceiling per stock (backstop, not the sizing rule)
  max_risk_per_trade_fraction: 0.005 # Max fraction of equity a single stop-out may cost (0.005 = 0.5%).
                                      # Dormant while final_exit_loss_pct is tight (a 1% stop puts this
                                      # well above ceiling 1); it binds once the stop is widened.
  max_daily_loss_usd: 2000  # Stop trading if daily loss exceeds this. Raised 1000 -> 2000 to let a
                             # test session run further before halting - at 1000 the limit would have
                             # ended 2026-08-19 at exit 17 of 71, collecting little data.

  # --- Burst throttle ---
  # When many symbols signal in the SAME poll they are rarely independent
  # ideas - it is one market move surfacing in many tickers at once. On
  # 2026-08-19 twenty names fired inside nine seconds; that book was not
  # twenty bets but one bet held twenty times, and it went 1 winner / 23
  # exits / -$1,307. Above the threshold the bot takes fewer of them AND
  # sizes each smaller.
  # This limits how much is committed to a single market move. It is NOT
  # diversification and NOT ranking - picking the "best" of a burst needs
  # evidence, which is what the signal journal below is collecting.
  #
  # The cap is PER POLL, not per day, so a burst that keeps signalling still
  # fills the book over successive minutes rather than being blocked outright.
  # Measured against a simulated 20-symbol burst under production caps, the
  # net effect is: the same 10 positions (max_concurrent_positions binds
  # either way) but roughly HALF the capital committed, entered across five
  # polls instead of nine seconds. Staggering is itself worth something -
  # each later poll is a fresh look at whether the move is still intact.
  use_burst_throttle: true
  burst_width_threshold: 5    # this many simultaneous signals counts as a burst
  burst_max_entries: 3        # take at most this many of them
  burst_size_multiplier: 0.5  # and size each at this fraction of normal

  # --- Take profit (EXPERIMENTAL - added 2026-08-20 for the 08-21 session) ---
  # Sell take_profit_fraction of the position once it is up take_profit_pct.
  # Fires at most once per position; the remainder keeps running under the
  # trailing stop.
  #
  # THE 2026-08-20 DATA ARGUES AGAINST THIS. Only 3 of 25 trades that day ever
  # reached +1%, and those three were the entire day's profit (MARA +$121,
  # RIOT +$59, LYFT +$44). Trimming half of each would have clipped the only
  # winners while doing nothing for the other 22 trades, which never got near
  # the trigger. It is on to be measured, not because the evidence supports it.
  # Compare take_profit_pct against the mfe_pct column in trade_history.csv
  # before keeping it past the 08-21 session.
  use_take_profit: true
  take_profit_pct: 1.0        # gain % that triggers the scale-out
  take_profit_fraction: 0.5   # fraction of the ORIGINAL position sold

  # --- Exposure caps ---
  # Checked BEFORE every entry attempt (see Executor.pre_entry_check) - the
  # bot will never even try to submit an order that would breach either of
  # these, rather than relying on the broker's margin engine to eventually
  # reject it once out of room. This is what let the account run to ~2.8x
  # leverage across 28 simultaneous positions on 2026-08-18 before anything
  # stopped it - Alpaca's own rejection was the only backstop that existed.
  max_concurrent_positions: 10      # never hold more than this many positions open at once

  # Total positions OPENED over the whole day, regardless of how many are held
  # at once - a different limit from max_concurrent_positions above. On
  # 2026-08-19 the concurrent cap of 10 held, yet 54 buys still went through in
  # ~21 minutes, because positions kept closing and new ones opening in their
  # place. This caps that churn. Set to 0 (or remove) for unlimited.
  # Only entries are blocked once the cap is hit - exit monitoring continues,
  # so open positions are never left unprotected.
  # Raised 25 -> 50 for data collection. 2026-08-19 ran UNCAPPED and took 54
  # entries, so 25 would have collected less than half of a day that was
  # already considered too small a sample. 50 gives a comparable sample while
  # still cutting the tail of pure churn.
  # NOTE: this is very unlikely to be the binding constraint - see
  # max_daily_loss_usd. The loss limit now actually fires (it never once did
  # before), and on 2026-08-19 numbers it would have ended the session around
  # entry 40, before this cap was ever reached.
  max_daily_entries: 50

  max_total_exposure_fraction: 0.9  # never commit more than this fraction of CURRENT equity, combined,
                                     # across all open positions - a fraction (not a fixed $) so it scales
                                     # automatically with account size instead of needing to be re-tuned

  # Stock universe (can be dynamic or static)
  use_daily_screener: true  # Set to true to dynamically select stocks each day
  screener_start_time: "09:05"  # ET. Screener runs PRE-MARKET so the symbol list is ready
                                 # at the bell. It previously waited for the market to open
                                 # first, which burned the first ~2.5 min of the entry window.
                                 # Leave enough headroom for screener_timeout_seconds below.
  candidates_file: "candidates.txt"  # File with candidate symbols
  num_stocks_to_trade: 15  # Number of top stocks to select each day
  min_screener_score: 35  # Minimum score to trade (0-100)
  screener_timeout_seconds: 420  # 7 min hard cap on the screener. With ~50+ candidates,
                                  # each scored via several sequential API calls (including
                                  # a yfinance earnings lookup), the screener can run slow.
                                  # If it hasn't finished by this deadline, it's aborted and
                                  # the bot falls back to the static stock_universe list below
                                  # rather than eating into the entry window.

  # ---------------------------------------------------------------------
  # Pre-open list augmentation (earnings + QQQ), added 2026-08-21
  # ---------------------------------------------------------------------
  # A SECOND pre-market stage, run in the buffer between the screener and the
  # bell. Both lists are scored, cut to their best N, and ADDED to the day's
  # watchlist - they never replace or displace what the screener picked.
  #
  # Runs later than the screener on purpose. Earnings reactions need pre-market
  # prints to have accumulated, and the QQQ trend read is a read of TODAY's
  # tape; at 09:05 both would be measuring an empty book.
  list_builder_start_time: "09:20"

  # Earnings list: today's before-the-bell reporters plus yesterday's
  # after-the-bell ones - i.e. only the names whose news is already priced-in
  # to pre-market. A company reporting after TODAY's close has no catalyst at
  # 09:35, so it is excluded.
  #
  # Source is Nasdaq's free public earnings calendar (no API key). If it is
  # unreachable the list is simply empty and the watchlist is unchanged.
  use_earnings_list: true
  earnings_list_top_n: 10
  earnings_calendar_timeout_seconds: 20

  # QQQ list: the Nasdaq-100 constituents in src/screener/qqq_constituents.txt,
  # used ONLY on days QQQ is itself trending up (gap, N-day return and price-vs-
  # average, majority of three). On a flat or falling index these names are
  # heavily correlated, so adding 10 of them is one bet held ten times rather
  # than ten bets - the trend gate is what keeps that from happening daily.
  use_qqq_list: true
  qqq_list_top_n: 10
  qqq_trend_lookback_days: 5

  # Default stock universe. Watched EVERY DAY no matter what - merged with
  # (not replaced by) whatever the daily screener additionally picks. Also
  # used directly when use_daily_screener is false, and as the fallback if
  # the screener errors, times out, or returns zero candidates.
  stock_universe:
    - "UBER"
    - "LYFT"
    - "ABNB"
    - "DASH"
    - "RBLX"
    - "PLTR"
    - "HOOD"
    - "COIN"
    - "SOFI"
    - "SNAP"
    - "ROKU"
    - "CVNA"
    - "RIVN"
    - "U"
    - "AFRM"
    - "UPST"
    - "MARA"
    - "RIOT"
    # --- expanded from 18 to 50, same mid-cap/high-beta character as above ---
    - "CLSK"  # crypto miner
    - "HUT"   # crypto miner
    - "CIFR"  # crypto miner
    - "WULF"  # crypto miner
    - "BITF"  # crypto miner
    - "LCID"  # EV
    - "NIO"   # EV
    - "XPEV"  # EV
    - "LI"    # EV
    - "PINS"  # consumer/social
    - "DKNG"  # gaming/betting
    - "BMBL"  # consumer/social
    - "CHWY"  # consumer e-commerce
    - "MTCH"  # consumer/social
    - "GME"   # high-beta/retail favorite
    - "AMC"   # high-beta/retail favorite
    - "TLRY"  # cannabis
    - "CGC"   # cannabis
    - "PLUG"  # clean energy
    - "FCEL"  # clean energy
    - "RUN"   # clean energy
    - "IONQ"  # AI/quantum momentum
    - "SOUN"  # AI/quantum momentum
    - "RGTI"  # AI/quantum momentum
    - "AI"    # AI/quantum momentum
    - "RKLB"  # space
    - "ASTS"  # space
    - "OPEN"  # gig/marketplace
    - "CART"  # gig/marketplace
    - "GRAB"  # gig/marketplace
    - "NU"    # fintech
    - "FUBO"  # streaming

  # Raised 5 -> 10. A one-cent spread is a fixed dollar cost, so as a PERCENT
  # it explodes at low prices - and every stop here is a percent. At PLUG's
  # $2.19 a penny is 0.46%, which eats 92% of the distance to the -0.5% first
  # exit, so the position sits at its stop the moment it fills. Sub-$10 names
  # went 16 trades / 1 winner / -$623 on 2026-08-19, 36% of the day's loss
  # from 23% of its trades. Deliberately 10 rather than 15: NU at $14.38 was
  # the day's best trade (+$279), and a threshold tuned finely enough to
  # exclude it is fitting noise on a 71-trade sample.
  min_stock_price: 10
  max_stock_price: 300
  min_avg_volume: 1000000  # Minimum average daily volume

broker:
  paper_trading: true  # Set to false for live trading
  base_url: "https://paper-api.alpaca.markets"  # Paper trading endpoint

logging:
  level: "INFO"
  log_file: "logs/trading.log"

notifications:
  # ---------------------------------------------------------------------
  # SMTP - the original path. OFF, because it cannot work here.
  # ---------------------------------------------------------------------
  # DigitalOcean filters outbound 25/465/587, so every send this bot has
  # ever attempted failed with "Network is unreachable" before the SMTP
  # dialogue even began. Left in place (and still honoured if enabled) for
  # any host that isn't blocked; use the HTTPS channels below on this one.
  #
  # The password formerly sat here in plaintext and was committed to git.
  # It has to be ROTATED at https://myaccount.google.com/apppasswords, and
  # if SMTP is ever re-enabled the new one belongs in the environment as
  # SMTP_PASSWORD - not in this file, which is public to anyone with the repo.
  email:
    enabled: false
    sender_email: "shahbazfarhan25@gmail.com"
    recipient_email: "shahbazfarhan25@gmail.com"
    smtp_server: "smtp.gmail.com"
    smtp_port: 587

  # ---------------------------------------------------------------------
  # Resend - email over HTTPS (port 443). Cannot be blocked here.
  # ---------------------------------------------------------------------
  # Setup: sign up at resend.com, create an API key, then on the Droplet
  #   echo 'RESEND_API_KEY=re_xxxxxxxx' >> /etc/market-bot.env
  # and flip enabled to true. NEVER put the key in this file.
  #
  # With no verified domain, Resend permits sending only FROM
  # onboarding@resend.dev TO the address the account was registered with -
  # which is exactly this use case, a report mailed to yourself. Verify a
  # domain only if the report ever needs to reach a second address.
  resend:
    enabled: true
    from: "onboarding@resend.dev"
    to: "shahbazfarhan25@gmail.com"

  # ---------------------------------------------------------------------
  # Pushover - phone push over HTTPS. The channel that actually matters.
  # ---------------------------------------------------------------------
  # Setup: get the User Key from the Pushover app, create an application
  # token at https://pushover.net/apps/build, then on the Droplet
  #   echo 'PUSHOVER_TOKEN=xxxx' >> /etc/market-bot.env
  #   echo 'PUSHOVER_USER=xxxx'  >> /etc/market-bot.env
  # and flip enabled to true.
  #
  # priority: -1 quiet, 0 normal, 1 bypasses quiet hours. Keep 0 for the
  # daily report; 1 is for alerts you want at 09:31 regardless.
  pushover:
    enabled: false
    priority: 0

  # ---------------------------------------------------------------------
  # When the report is sent
  # ---------------------------------------------------------------------
  # The full report (every closed trade, plus any positions still open) goes
  # out at each of these ET times, ON TOP OF the one sent the moment the last
  # position of the day closes. So a normal day produces three:
  #
  #   10:35  midday status - closed trades so far AND open positions, with
  #          unrealized P&L, MFE and MAE on each
  #   ~when all trades close - sent by finish_day, whenever that happens
  #   16:00  closing report
  #
  # If the session ends early (2026-08-20 finished at 10:14) the 10:35 and
  # 16:00 sends still fire from the idle loop, so an early finish does not
  # silently cost you two of the three.
  #
  # A 16:00 slot is NOT double-sent when the day ends by time-stop at 16:00 -
  # finish_day claims that slot as it fires.
  report_times: ["10:35", "16:00"]

  # A slot already this many minutes past when the process STARTS is recorded
  # as sent rather than fired, so restarting at 15:00 does not deliver a
  # "midday status" five hours late. A restart shortly after a slot still sends.
  report_catchup_minutes: 30

analytics:
  # Records EVERY entry signal that fires - taken or not - with the features
  # available at that moment, then follows each forward to see what the symbol
  # actually did. The skipped signals are the control group: without them,
  # "buy the best 3 of the 20 that fired" is an untestable claim.
  # Purely observational - written after the entry decision, never gates one.
  log_signals: true
  signal_log_file: "logs/signal_journal.csv"
  forward_return_minutes: [15, 30]
