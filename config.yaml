trading:
  # --- Entry signal parameters ---
  # Entry decisions are made by watching each screened candidate's price DURING
  # the entry window below (not at one single instant anymore). If a symbol's
  # price rises by at least `rapid_increase_pct` within any trailing
  # `rapid_increase_lookback_minutes` window, it is bought.
  # Raised 09:30 -> 09:35. On 2026-08-19 entries in the 9:34 and 9:46 bursts
  # went 1 win / 30 trades for -$1,884, while entries from 9:51 onward went
  # 6 wins / 12 trades for +$356. In the opening minutes nearly every
  # high-beta name clears rapid_increase_pct at once, so the signal selects
  # "the market opened" rather than any individual stock's strength.
  entry_window_start: "09:33"        # Start watching candidates for a rapid price rise (HH:MM ET)

  # ---------------------------------------------------------------------
  # Opening-move experiment (added 2026-08-27)
  # ---------------------------------------------------------------------
  # A SEPARATE entry mode for the first minutes after the bell, running BEFORE
  # and independently of the normal entry window above.
  #
  # The idea being tested: measure each streamed symbol from the 09:30 open,
  # and buy the ones that are up by 09:31/09:32. Decide fast, then hold.
  #
  # WHY IT IS A SEPARATE MODE RATHER THAN entry_window_start: "09:30".
  # Simply moving the window earlier would run the NORMAL rule (0.3% over 3
  # minutes) at the open, where nearly every high-beta name clears 0.3% at
  # once. max_concurrent_positions would fill within seconds and the rest of
  # the session would have no capacity left - which is exactly the 2026-08-19
  # shape, 20 entries inside 9 seconds for 1 winner in 23 and -$1,307. Keeping
  # it separate is what allows a normal testing day AND this experiment on the
  # same session.
  #
  # WHAT THE EVIDENCE SAYS, because it is not encouraging and should be visible
  # right here rather than in a commit message. On 2026-08-19 entries in the
  # 9:34 and 9:46 bursts went 1 win / 30 trades for -$1,884, while entries from
  # 9:51 onward went 6 wins / 12 trades for +$356. That measurement is why
  # entry_window_start was moved to 09:33 in the first place. In the opening
  # minutes "it went up" largely selects THE MARKET OPENED rather than any
  # individual stock's strength. This mode is a deliberate, budgeted retest of
  # that conclusion with better instrumentation - not a reversal of it.
  opening_burst:
    enabled: true

    # Measure from this instant. The stream is subscribed BEFORE the open (see
    # stream_prestart_minutes) so a price actually exists at 09:30:00.
    baseline_time: "09:30"

    # No opening entry after this. The whole point is an early decision.
    #
    # 09:32 -> 09:33 for 2026-08-31. Not a change of heart about deciding early:
    # the window was closing before there was anything to decide ON. Across two
    # sessions the stream served 0/28 and then 3/27 watched symbols in the first
    # seconds after the bell - not because the socket was slow (it connected at
    # 09:26 and ended the day healthy, 38,454 trades) but because IEX carries
    # ~2% of US volume, so a stock trading on Nasdaq and NYSE has no IEX print
    # to send. Coverage, not latency.
    #
    # Baselines are captured on each symbol's FIRST print rather than fixed at
    # 09:30, so a longer window lets late-printing symbols get a baseline AND a
    # follow-up reading. The cost is a later baseline for those symbols, which
    # is a real cost - a move measured from 09:32 is not the move from the open.
    # Measuring 12 symbols late beats measuring 3 early, but only just, and this
    # should come back down if the readiness ramp below shows it can.
    #
    # WHY 09:33 AND NOT LATER. entry_window_start is 09:33, and the burst
    # closing exactly as normal entries open is what keeps the experiment
    # separable from the session it runs alongside - an overlap would let burst
    # trades and normal trades compete for the same slots, and neither result
    # would mean anything afterwards. 09:34 was tried and reverted for this;
    # test_timeline.py asserts the handoff. Going later requires moving
    # entry_window_start too, which changes the part of the system that works.
    decide_by: "09:33"

    # Minimum move from the baseline to qualify. 0.0 means "any increase",
    # which is what the strategy as described asks for. Raise it to require a
    # real move rather than a tick above the open.
    # 0.5% from the open. Chosen against the measured spread rather than picked
    # round: median bid-ask across the plausible symbols on 2026-08-26 was
    # 0.126%, so 0.5% is ~4x the noise floor and cannot be produced by a single
    # bid/ask bounce. It is still loose enough to fill the budget - signals over
    # a 3-minute window that session had a median of 0.63%.
    #
    # One symbol to watch: HOOD quoted a 0.593% median spread, WIDER than this
    # threshold, so for names like it a "+0.5% move" can still be one print
    # crossing the spread. If the opening trades cluster in wide-spread symbols,
    # raise this rather than blaming the strategy.
    # 0.5 -> 0.3 for 2026-08-28. The point of the session is to see this mode
    # actually TRADE - it has never taken a position - and 0.5% over two minutes
    # is a demanding filter on a quiet open. 0.3% is still 2.4x the median
    # bid-ask measured on 2026-08-26 (0.126%), so it cannot be produced by a
    # single bid/ask bounce, but it will qualify materially more names.
    #
    # Watch the OPENING THRESHOLD REVIEW line at 09:32: it prints every measured
    # symbol's move and says what threshold would have caught what. Set the next
    # value from that rather than from guesswork.
    min_move_pct: 0.3

    # Multi-factor gate, added 2026-09-02: on top of min_move_pct, refuse a
    # candidate whose move is not at least this many times its OWN bid-ask
    # spread. HOOD's median spread measured 0.593% on 2026-08-26 - wider than
    # min_move_pct itself - so a flat move threshold alone cannot tell "a real
    # +0.3% move" from "one print crossing a 0.3%+ spread". 2.0 means the move
    # must be double the spread; 0 disables the gate. See _run_opening_burst
    # for why this is spread-only rather than the full cf_score composite
    # (mostly None this early - opening_range_minutes/vwap/sector all need a
    # window this mode decides within before it exists).
    min_move_to_spread_ratio: 2.0

    # Multi-factor ranking (added 2026-09-02) - PENDING_WORK backlog item 4.
    # %move stays the CANDIDATE FILTER (min_move_pct above); this decides
    # which of the survivors get the budget, using the same cf_score
    # machinery the normal entry path uses instead of raw move size.
    #
    # Honest about what is measurable at 09:31: opening_range_minutes is 5,
    # so there is no opening high to break out of yet; VWAP has ~a minute of
    # prints; sector returns need a window the session has not accumulated.
    # Those score None, and continuation_score renormalises over missing
    # factors rather than treating them as zero - so early on this ranks on
    # efficiency, volume acceleration and spread, and falls back to move
    # order when nothing is scoreable at all.
    #
    # Ranking, never gating: it changes WHICH candidates are bought, never
    # how many. Requires use_continuation_score.
    #
    # SHIPPED OFF, on evidence from its own first test. Wired and covered,
    # but with it ON the first live-shaped run ranked a +0.2% mover ABOVE a
    # +3.0% one - a clean inversion of the single factor that HAS evidence
    # behind it. The cause is structural, not a bug: continuation_score
    # renormalises over whatever factors exist, so at 09:31 a candidate with
    # one minute of history still returns a number, computed from almost
    # nothing. A number is not information.
    #
    # This follows the same discipline cf_sector_strength shipped under -
    # computed and journalled at zero influence until the ledger shows it
    # keeps its sign. cf_score is ALREADY recorded per signal, so the
    # evidence accumulates either way: correlate cf_score against the
    # opening burst's own forward returns, and turn this on if it holds.
    #
    # Turning it on without that check would put an unvalidated reordering
    # into the one mode that has never yet had a clean session.
    multifactor_rank: false

    # Safety valve for when it IS turned on: refuse to reorder unless at
    # least this fraction of candidates produced a score. Below it, move
    # order stands - the better-evidenced ranking.
    min_scored_fraction: 0.5

    # Its OWN position budget, deliberately small. These do not get to consume
    # max_concurrent_positions and starve the normal session; they are an
    # experiment running alongside it.
    # 7 of the 10 concurrent slots, leaving 3 for the normal session. These
    # trades are expected to be short-lived, so slots should free up well before
    # the 09:33 window matters - but if the opening book is still full when the
    # normal session starts, the constraint that bites is
    # max_concurrent_positions, NOT the re-entry cooldown (which is 5 minutes
    # and only applies after a LOSING exit on the same symbol).
    max_positions: 7

    # Half size for the same reason - this is a test, not a conviction.
    size_multiplier: 0.5

    # Streamed symbols only. A REST symbol's price is ~15 minutes delayed, so
    # its "move since the open" describes a window that has not happened yet.
    streamed_only: true

    # NOTE: this mode never consults the continuation score, and there is no
    # flag for it because there is nothing to switch. The score is BLIND this
    # early - opening_range_minutes is 5 so there is no opening high, VWAP has a
    # minute of data, and sector returns need a window, so cf_score would be
    # built almost entirely from None. The mode takes qualifying symbols in
    # watchlist order until its budget is spent.

    # rapid_increase_max_pct does not apply here. That ceiling exists to refuse
    # a move that has already spent itself over a 3-minute window; this mode is
    # explicitly buying the strongest openers, so applying it would refuse the
    # exact candidates the experiment is about.
    ignore_max_pct: true

    # An opening trade must not block the normal session from re-entering the
    # same symbol later - that would make the experiment change the control.
    skip_reentry_cooldown: true

    # --- Exit profile for opening trades ONLY -----------------------------
    #
    # These keys overlay the normal trading config for positions opened by this
    # mode. Everything NOT listed here keeps the session's setting, so the
    # resistance exit, momentum fade and 16:00 time stop all still apply - an
    # exit profile written from scratch would silently drop whatever nobody
    # remembered to restate, and those omissions would read as decisions.
    #
    # A position keeps the profile it was opened with for its whole life.
    #
    # WHY TIGHTER. These are meant to be short scalps off the opening move, not
    # positions held through the session. The normal profile is built for a
    # trade that has 20+ minutes to work; this one is not.
    #
    #                        normal      opening      why
    #   first exit           -0.5%       -0.3%        cut a failed open faster
    #   final exit           -1.0%       -0.35%       cap the damage sooner
    #   trailing stop         0.75%       0.40%       give back less of a fast move
    #   take-profit tiers    1.0/1.25/1.5  0.75/1.0/1.25  take what a 3-min move gives
    #   breakeven trigger    0.5 / 0.3    0.15        protect sooner
    #
    # final exit -0.6% -> -0.35% for 2026-09-02, on request ("Hard stop:
    # -0.35%, Trailing: 0.40%, BE: +0.15%"). Trailing and BE were already at
    # those values (set 2026-08-31/09-01) - only the hard stop was still -0.6%.
    # first_exit_loss_pct stays at -0.3% (unchanged): it is the PARTIAL
    # scale-out that fires before the hard stop, and -0.3% already sits
    # tighter than -0.35%, so the ordering (partial, then full) still holds.
    #
    # THE RISK, stated plainly: the opening minutes are the most volatile of the
    # day, and a tighter stop in higher volatility is more likely to be hit by
    # noise rather than by the trade actually failing. -0.3% is roughly 2.4x the
    # median bid-ask measured on 2026-08-26 (0.126%), which is enough clearance
    # for most symbols and NOT enough for the widest - HOOD quoted 0.593%, so a
    # position in a name like that could be stopped out by the spread alone.
    # Whether that happens is exactly what tomorrow measures; the per-trade exit
    # reasons in the report are how it will show.
    exits:
      first_exit_loss_pct: -0.3
      final_exit_loss_pct: -0.35
      trailing_stop_pct: 0.40
      # Measured from the ENTRY price, not from the 09:30 baseline that
      # min_move_pct uses - different anchors. A position entered at +0.5% from
      # the open needs another +0.5% to reach the first tier, i.e. roughly +1.0%
      # from the open, so the first tier and the entry threshold sharing the
      # number 0.5 does not mean a trade can qualify and scale out on the same
      # move. (An earlier revision of this comment claimed it could; that was
      # wrong, and the tiers were briefly raised to 0.75/1.0/1.3 on the strength
      # of it.)
      # 0.5/0.75/1.0 -> 0.75/1.0/1.25 for 2026-09-01. Measured from the ENTRY
      # price, not from the 09:30 baseline that min_move_pct uses - a position
      # entered at +0.3% from the open needs another +0.75% to reach the first
      # tier, i.e. roughly +1.05% from the open.
      take_profit_tiers:
        - {gain_pct: 0.75, sell_fraction: 0.33}
        - {gain_pct: 1.0,  sell_fraction: 0.40}
        - {gain_pct: 1.25, sell_fraction: 1.0}
      # Arms almost immediately: touch +0.05% and the stop sits at +0.05%, so
      # the position cannot go on to lose money.
      #
      # STATED PLAINLY, BECAUSE IT MATTERS: 0.05% is BELOW the median bid-ask
      # measured on 2026-08-26 (0.126%). A single print crossing the spread can
      # arm this floor, and the next print crossing back can trigger it. The
      # likely outcome is that most opening trades end as scratches at +0.05%
      # rather than either winning or losing - the downside is capped, and so is
      # essentially all of the upside, because a real move gets stopped out on
      # its first pullback before it can run.
      #
      # That is the trade requested for 2026-08-31 and it is a reasonable thing
      # to WANT on an experiment whose only losing outcome so far has been
      # entering badly. Judge it on the exit-reason table: if BREAKEVEN_STOP
      # dominates and the "ran further" column shows the moves continued, raise
      # trigger_pct back toward 0.2-0.3 so the floor arms after the noise band
      # rather than inside it.
      breakeven_tiers:
        # 0.15 = clear of the 0.126% median bid-ask measured on 2026-08-26, with
        # margin. 0.127 sat only 0.001pp above it, which is not really clearance
        # at all - the median is a median, so half the symbols quote WIDER than
        # it, and for those a 0.127 trigger is still inside the spread.
        # 0.05 was tried first and rejected on arithmetic: a trigger inside the
        # spread can be armed by one print crossing it and fired by the next
        # crossing back, so the floor would have caught noise rather than moves.
        # This is the smallest trigger that cannot be produced by the spread
        # alone - protection as early as it can be had honestly.
        #
        # The floor stays at 0.05: once armed, exit just above entry. Together
        # that means a trade which clears the spread cannot go on to lose.
        #
        # WATCH ON 2026-08-31: if BREAKEVEN_STOP dominates the opening trades'
        # exit reasons AND the "ran further" column shows those moves continued,
        # this is still arming too early - raise to 0.2-0.3.
        - {trigger_pct: 0.15, floor_pct: 0.05}

  # Subscribe the WebSocket this many minutes BEFORE the open.
  #
  # The stream used to start only once is_market_open() went true, and the
  # pre-market loop sleeps 30s per iteration - so the socket could open up to
  # 30 seconds after the bell, then still had to connect, authenticate,
  # subscribe and receive. The first usable price realistically landed
  # 09:30:35-09:31:00. Harmless for a 09:33 entry window; fatal for a mode that
  # measures from 09:30:00 and decides by 09:32. Alpaca accepts pre-market
  # subscriptions, so connecting early costs nothing and means a price exists
  # when the bell rings.
  # Widened 2 -> 4. The stream can only subscribe once the watchlist is FINAL,
  # which is after the 09:28 list builder, so this cannot simply be moved to
  # 09:26 - doing so would either subscribe an incomplete list or subscribe
  # nothing. What a wider window buys is that the socket opens the INSTANT the
  # list is ready rather than waiting for a narrow slot, which matters on a
  # morning when the earnings calendar fetch runs slow.
  stream_prestart_minutes: 4
  # Widened 09:55 -> 10:00 for 2026-08-31, alongside moving the breadth halt to
  # 09:45. The two go together: a later halt only buys more evidence if there is
  # still window left to trade after it, and at a 09:45 halt against a 09:55 end
  # only 10 of 22 minutes remained.
  #
  # 10:00 -> 10:15 for 2026-09-02. The halt itself stays at 09:45 pending
  # ops/breadth-counterfactual.py against a few more sessions - widening this
  # alone gives the four positions that survive the halt (or any pre-halt
  # entry still working) more room to reach take-profit before the window
  # closes, without loosening the -0.3% floor that decided whether new
  # entries opened at all.
  entry_window_end: "10:15"          # Stop looking for NEW entries after this time (HH:MM ET).
  # --- Real-time price stream ---
  # Alpaca's free tier delays the REST historical endpoint by ~15 minutes but
  # carries the same IEX data LIVE over the WebSocket - a delivery-mechanism
  # difference, not a data-tier one, so this needs no plan upgrade. Every
  # entry/exit decision used to read REST-delayed prices, which is why
  # rapid_increase_lookback_minutes had to be widened from 2 to 5 (a window
  # shorter than the feed lag can never accumulate two in-window samples).
  # It also removes one REST call per symbol per poll - 57 round-trips a cycle
  # on a 57-symbol watchlist.
  # If the stream drops or has no fresh bar for a symbol, that read falls back
  # to REST automatically, so turning this off (or a stream failure) simply
  # restores the previous behavior.
  # OFF for 2026-08-20. The stream is built, tested (87 cases) and safe to
  # enable - it falls back to REST per symbol and a watchdog abandons it
  # entirely after 120s of silence - but its live connection has never been
  # verified against Alpaca from the production host, and this session is
  # already carrying the ET/UTC clock fix, the position-set reconciliation,
  # the daily entry cap, equity-based sizing, the resistance floor, the
  # re-entry cooldown and a daily-loss limit that now actually fires. Those
  # target confirmed losses; this one is a latency optimization. Enabling it
  # the same day would make an unexpected result impossible to attribute.
  # Flip to true to turn the stream on - nothing else needs to change.
  use_websocket_stream: true

  # Alpaca's free/IEX feed caps subscriptions per connection. Going over does
  # NOT fail loudly: the socket connects, reports healthy, returns
  # "error: symbol limit exceeded (405)", and then delivers ZERO bars forever.
  # On 2026-08-21, 59 symbols were subscribed and the watchdog spent 120s
  # discovering the silence before falling back to REST for the whole session.
  #
  # COUNTING MODEL CORRECTED 2026-09-02: this is now a count of UNIQUE
  # SYMBOLS, not of channel-subscriptions, so trade ticks are FREE rather
  # than halving reach.
  #
  # The 2026-09-01 subscribe acknowledgement is what settles it - the old
  # model cannot explain it:
  #
  #   subscribed to trades: [14], bars: [14], corrections: [14],
  #              cancelErrors: [14]
  #
  # Four channels x 14 symbols = 56 channel-subscriptions ACCEPTED, against a
  # configured cap of 28. Under "bars and trades each count as one" that
  # should have been rejected at 28. It was not. And 2026-08-21's `symbol
  # limit exceeded (405)` came at 59 SYMBOLS. One rule fits both: ~30 unique
  # symbols on free IEX, regardless of what you subscribe them to.
  #
  # The old model spent half the budget on nothing - 14 symbols streamed
  # where ~30 were available - which is exactly why the 2026-09-01 opening
  # burst chose from a field of 2 (coverage read 2/26 at 09:30:17, 14/26 at
  # 09:31:28; all 14 SUBSCRIBED symbols delivered, the other 12 were never
  # subscribed).
  #
  # SET TO 14 FOR 2026-09-02, deliberately conservative.
  #
  # The COUNTING MODEL above is well-evidenced and is not in doubt. What is
  # untested is the BOUNDARY: no live session has ever subscribed more than
  # 14 symbols successfully, so 29 was an inference, not an observation. The
  # _reduce_and_retry backoff that would rescue a wrong guess has passing
  # offline tests and has never run against Alpaca.
  #
  # 14 is the exact count that ran on 2026-09-01 and worked, so it carries
  # zero new risk. The cost is real - the opening burst keeps choosing from a
  # narrow field, which is the constraint the wider cap was meant to lift -
  # but that is a known cost on a session that is already testing ten other
  # changes, against an unknown one.
  #
  # TO TEST HIGHER: raise this on a day you are watching the log at 09:26,
  # one step at a time (20, then 25, then 29). The failure is loud and
  # immediate - "symbol limit exceeded" within milliseconds of subscribing -
  # so a bad guess is visible before the bell, not discovered from an empty
  # session afterwards.
  #
  # The original reasoning for 29, kept for when that test happens:
  # 29, NOT 30, and deliberately: sitting exactly AT a vendor limit costs
  # the whole session's stream if the bound turns out to be exclusive, and
  # costs one symbol if it does not. 29 of a possible 30 is still more than
  # double the 14 the old counting model allowed, and it keeps the opening
  # burst - the most timing-sensitive window of the day - from spending its
  # first seconds probing a boundary.
  #
  # The limit is not yet empirically confirmed. If the real cap is lower, the socket
  # says `symbol limit exceeded` in milliseconds and PriceStream now STEPS
  # THE COUNT DOWN and reconnects (_reduce_and_retry) instead of abandoning
  # the session to ~15-min REST - so being wrong costs a reconnect, not the
  # opening-burst measurement. That fallback is the reason this is safe to
  # test on a live session at all.
  #
  # Symbols beyond the cap are not dropped from the watchlist - they simply
  # get REST prices, which is what every symbol used before the stream
  # existed.
  #
  # Priority goes to the screener's picks and the day's earnings/QQQ adds; the
  # static universe fills whatever is left.
  # Stream SPY and the day's sector ETFs alongside the watchlist.
  #
  # SPY was never subscribed, so get_latest_bar("SPY") always fell through to
  # REST - ~15 minutes delayed on the free tier. Every excess_vs_spy_pct has
  # therefore compared a LIVE symbol move against a DELAYED market move, and
  # cf_rel_strength (weighted +0.20) is built on that comparison. On 2026-08-26
  # cf_rel_strength measured rho -0.344 against forward returns, the opposite
  # sign to its weight. A stale benchmark is a strong candidate for why, and it
  # is cheap to remove as a variable.
  #
  # Benchmarks are subscribed LAST, after every tradeable symbol, so they can
  # never displace a name the bot could actually buy. num_stocks_to_trade is 15
  # against the budget below, so there is room; if there ever is not, they fall
  # back to REST exactly as they do today.
  stream_benchmarks: true

  # Reserve two subscription slots for SPY and QQQ specifically.
  #
  # Benchmarks are appended LAST, so with a 15-symbol watchlist against a
  # 14-symbol budget they were never actually streamed - SPY has been on
  # ~15-minute-delayed REST every session so far. That was tolerable when SPY
  # only fed a journal column. It is not tolerable now: regime_sizing reads
  # SPY and QQQ against their own VWAP and can size the entire day to ZERO on
  # what it sees, and a regime decided from quarter-hour-old index prices is
  # worse than having no regime rule at all.
  #
  # The cost is the last two watchlist names dropping to REST. That is the
  # right trade - the 13th and 14th ranked symbols are the least likely to
  # produce a signal, and neither can decide the whole session the way the
  # regime read can. Sector ETFs stay last; they only inform a journal column.
  stream_reserve_index_slots: true

  stream_max_subscriptions: 14
  websocket_feed: "iex"   # iex = free tier. sip requires a paid subscription.

  # Subscribe to live TRADES as well as bars, and use the latest tick as the
  # price for ENTRY DETECTION. Exits keep reading 1-minute bar closes.
  # The split is deliberate. Entries want speed: on 2026-08-20 losing entries
  # landed at the 87th percentile of the surrounding half-hour while winners
  # landed at the 43rd - losers were systematically buying the local top, which
  # is what acting on delayed prices looks like. Exits want stability:
  # RESISTANCE fired 14 times that day on moves as small as 0.08%, so putting
  # ticks into the exit path would undo that fix.
  # Consequence: a bad print can only cause a missed or slightly-early ENTRY.
  # It can never stop out a good position.
  # Requires use_websocket_stream; ignored otherwise, and falls back to the bar
  # close whenever no trade has arrived in the last 30s.
  #
  # STAYS ON. Briefly turned off on 2026-09-02 to buy stream coverage, then
  # turned back on the same day when the coverage problem turned out to have
  # a better cause: Alpaca caps UNIQUE SYMBOLS, not channel-subscriptions
  # (see stream_max_subscriptions above for the evidence). Under the correct
  # model ticks cost nothing at all - they are a second CHANNEL on a symbol
  # already being paid for - so there is no coverage/precision trade to make.
  # ~30 symbols WITH tick precision, rather than 26 without.
  use_trade_ticks_for_entry: true

  # 60 -> 10 on 2026-08-25. Reads are now free: the WebSocket has served ~80%
  # of bars for two sessions running, so a faster loop costs no API calls for
  # streamed symbols. The prize is gap risk on stops: RKLB's -1.0% stop fired at
  # -1.49% on 2026-08-25 because price crossed the level BETWEEN two 60-second
  # checks. Six times the checks is roughly six times less room for that.
  #
  # ONLY safe because momentum_fade and resistance are now expressed in MINUTES
  # (below). As raw sample counts they would have become 6x more sensitive at
  # this interval.
  # Interval used when the stream is NOT serving. A 10s loop is free on streamed
  # prices (reads come from memory) but becomes ~6x the REST calls without it,
  # which at 15 symbols pushes toward Alpaca's ~200/min ceiling - and being
  # throttled would degrade the very fallback being relied on. The bot switches
  # between the two automatically, per poll, and logs each transition.
  # How long after an exit to record what the price did. Answers the questions
  # the record could not previously reach: did stopped-out losers keep falling
  # or bounce (is -1.0% too tight?), and did the breakeven floor close positions
  # that then ran (what does that floor actually cost?). Observation only - it
  # never restates the P&L that was booked.
  # ---------------------------------------------------------------------
  # Continuation factors (2026-08-26)
  # ---------------------------------------------------------------------
  # Six factors describing whether a burst looks like a move that CONTINUES or
  # one that has already happened. All computed from data the bot already
  # collects - streamed bars carry volume, the exit rules already keep a price
  # history, SPY is already sampled, and the screener already fetches daily
  # bars. No new subscriptions and no new API calls.
  #
  # SCORING IS OFF. The factors are written to the signal journal every poll
  # regardless, which is the entire point: weights fitted on five sessions would
  # describe the past and predict nothing. After ~2 weeks, correlate each cf_*
  # column against the journal's forward returns and set the weights from what
  # actually predicted. Only then turn use_continuation_score on.
  #
  # Sector confirmation landed 2026-08-26, over REST rather than the stream:
  # the ETFs cost no subscription slots that way, so it did not have to wait on
  # the subscription-counting test. It ships at zero weight (see below).
  # Market regime is still absent.
  # Turned ON 2026-08-26 at the user's direction. Read what this now does
  # before reading the weights: the score RANKS a burst best-first so the
  # throttle keeps the best signals instead of whichever names sorted earliest.
  # It does NOT gate - no signal is refused for scoring low, because the weights
  # below are still reasoned guesses rather than a fit, and a gate would delete
  # trades on the strength of a guess. Ranking only reorders a cut that was
  # already being made arbitrarily.
  #
  # Note this flag was inert until 2026-08-26 - both branches of the code that
  # read it computed the same thing and nothing consumed the result. Sessions
  # before that date have cf_score in the journal but it decided nothing, which
  # is what makes them a clean control group.
  use_continuation_score: true
  continuation_weights:
    efficiency: 0.20        # momentum persistence - trend, not whipsaw
    rel_strength: 0.20      # excess return over SPY
    vol_accel: 0.20         # volume RISING as price rises
    vwap_pos: 0.15          # buyers defending the session's average price
    rvol: 0.15              # is anyone actually here? only measurable since 2026-08-20
    breakout: 0.10          # clearing a level that means something
    spread: 0.05            # the precise version of what min_stock_price approximates
    exhaustion: -0.15       # NEGATIVE: how much of the move already happened
    # Added 2026-08-26 at ZERO weight on purpose. The factor is computed and
    # written to the journal from day one, but it decides nothing until the
    # ledger shows it keeping its sign across sessions. Every factor above was
    # weighted from reasoning rather than evidence, and on 2026-08-26 two of them
    # turned out to carry the WRONG sign (rel_strength weighted +0.20 against a
    # measured rho of -0.344; vwap_pos +0.15 against -0.375). Weighting a new one
    # by the same method would repeat that mistake knowingly.
    sector_strength: 0.0
  opening_range_minutes: 5

  post_exit_track_minutes: 15

  entry_check_interval_seconds_rest: 60

  # How often to re-check prices during the entry window, in seconds.
  #
  # 60 -> 10 once the WebSocket was working. The old 60s reasoning ("polling
  # faster just re-reads the same 1-minute bar") only held while prices came
  # from REST bars; a live stream carries every trade, so a 60s check meant a
  # stop could be up to 59s late. The REST fallback keeps the old rate - see
  # entry_check_interval_seconds_rest above.
  entry_check_interval_seconds: 10
  # 0.5%/5min -> 0.3%/3min for 2026-08-21, moved TOGETHER and only because the
  # WebSocket is on. Holding 0.5% while shortening the window would demand a
  # FASTER move, selecting harder-running names - and the 2026-08-19 data says
  # that is backwards (signal >= 1.0%: 6 symbols, 1 winner, -$531; signal
  # < 1.0%: 14 symbols, 4 winners, -$181). 0.5% over 5min is ~0.3% over 3min,
  # so this holds the implied velocity constant while reacting sooner.
  # A shorter window is only useful on live data: with REST-delayed prices,
  # entry timing is dominated by feed lag, not window width.
  rapid_increase_pct: 0.3            # Minimum % price gain within the lookback window to trigger a buy
  # CEILING on the entry signal. rapid_increase_pct is the floor - how big a
  # move must be to qualify. This is how big is TOO big: a signal above this is
  # SKIPPED, because the move has already happened and the -1.0% stop then sits
  # exactly where the natural pullback lands.
  #
  # Measured, not assumed. 2026-08-19: signals of 1.0%+ produced 1 winner in 6
  # for -$531; signals under 1.0% produced 4 winners in 14 for -$181. The
  # strongest-looking signals were the worst ones.
  #
  # 0 disables the ceiling. Skipped signals are still written to the signal
  # journal with their forward returns, so this can be re-tuned from evidence
  # rather than re-guessed.
  # 2.0 -> 1.25 for 2026-08-27, because 2.0 never once bound.
  #
  # The ceiling shipped at 2.0 as a deliberately loose first setting, on the
  # theory that the journal would record what it refused and the number could be
  # tuned from that. It refused NOTHING: on 2026-08-26 the largest signal all
  # session was 1.452% and only one exceeded 1.4%. A threshold that never fires
  # produces no control group and cannot be evaluated - it is not "working", it
  # is absent.
  #
  # 1.25 is where the evidence points, from two independent measurements:
  #
  #   cf_exhaustion, the continuous form of the same idea, falls monotonically
  #   against 15-minute forward return across every band on 2026-08-26 -
  #   0-19 returns +0.206% at a 66% hit rate, 40-59 turns negative at -0.269%,
  #   60-79 reaches -0.602% at a 7% hit rate. Exhaustion ~40 maps to a signal
  #   around 1.0%.
  #
  #   2026-08-19, separately: signals of 1.0% or more went 1-for-6 for -$531,
  #   while signals under 1.0% went 4-for-14 for -$181.
  #
  # 1.25 rather than 1.0 because it is the point that starts producing evidence
  # without cutting deeply into the distribution - on 2026-08-26 it would have
  # refused 4 signals whose mean 15-minute return was -0.955%, where 1.0 would
  # have refused 20 and 0.8 would have refused 60 of 176.
  #
  # THE CAVEAT, because it is real: at the 30-MINUTE horizon every exhaustion
  # band is positive, including 60-79. So this is short-horizon mean reversion
  # followed by recovery, not a permanent penalty. It is the right call only
  # because this strategy's exits fire within minutes, making 15 minutes the
  # horizon that decides the trade. If holding times ever lengthen, revisit it.
  rapid_increase_max_pct: 1.25

  # Apply the ceiling ONLY to symbols on the WebSocket. A REST symbol's price is
  # ~15 minutes delayed, so its "+2% over 3 minutes" describes a window that
  # closed a quarter of an hour ago - refusing a trade on a number that stale is
  # acting on noise. Streamed symbols carry a signal % that is genuinely
  # current, which is what makes the ceiling mean anything.
  #
  # Near enough a no-op at today's sizing: ~15 watched against 14 streamed, so
  # it exempts one or two symbols. It matters if the watchlist grows or the
  # stream drops.
  rapid_increase_max_pct_streamed_only: true

  rapid_increase_lookback_minutes: 3 # Rolling window, in minutes, that the % gain above is measured over.
                                      # Widened from 2min: the free IEX feed lags wall-clock by ~2-3min, and the
                                      # lookback cutoff is computed against wall-clock time, so a window shorter
                                      # than the feed delay could never accumulate 2 in-window samples (see the
                                      # wall-clock-cutoff fix in run_entry_window in main.py).

  # --- RSI pre-filter ---
  # Computed once per candidate at symbol-selection time (market open); would
  # gate entries on RSI < rsi_max_for_entry. Disabled: on the sharp opening-range
  # breakouts this strategy targets, RSI often shoots up through 50-70 as PART
  # of the move itself, so requiring RSI < 50 was filtering out exactly the
  # kind of aggressive breakout being chased. Left in place (off) rather than
  # removed in case it's wanted again later.
  use_rsi_filter: false
  rsi_period: 14        # Standard RSI lookback, in daily bars
  rsi_max_for_entry: 50 # Only watch candidates with RSI below this for entry signals

  # --- Pullback entry ---
  # Instead of buying the instant a rapid increase is detected (which can mean
  # buying right into the top of the initial thrust, just before a normal
  # pullback), wait for price to pull back off the peak and then resume
  # upward before actually entering - aims for a better average entry price
  # and avoids buying the exact local top of the spike.
  # OFF for now: this contradicts use_three_bar_momentum below in practice -
  # the cleanest, strongest thrusts (the ones that pass 3-bar momentum) are
  # exactly the moves this patient logic exists to NOT buy immediately, so
  # running both together meant the best-looking setups got the least
  # disciplined entry while choppier ones got the most. Toggle back on to
  # A/B test against the three-bar fast path.
  use_pullback_entry: false
  pullback_min_pct: 0.1              # Min retracement from the post-thrust peak (%) to count as "a pullback started"
  pullback_max_giveback_fraction: 0.75 # Invalidate the setup if the pullback erases more than this fraction of the thrust's gain (failed breakout)
  resumption_confirm_pct: 0.05       # Min bounce off the pullback low (%) to confirm resumption and actually buy

  # --- 3-bar momentum entry (fast path) ---
  # Checked ahead of the rapid_increase_pct/pullback logic above. Buys
  # IMMEDIATELY (no pullback-wait) the instant 3 consecutive 1-minute bars
  # are all green (close > open) with each bar's close higher than the last -
  # a faster, more aggressive confirmation than waiting for a % threshold to
  # accumulate over rapid_increase_lookback_minutes. Still gated by the RSI
  # filter above (if enabled). Runs alongside, not instead of, the signal below.
  # Independently toggleable from use_pullback_entry above so both can be
  # A/B tested separately.
  use_three_bar_momentum: true

  # Require the thrust to be ACCELERATING, not merely rising: each
  # close-to-close gap must be strictly bigger than the one before it.
  #   9.51 -> 9.55 -> 9.56  (gaps +0.04, +0.01)  rejected - move is stalling
  #   9.51 -> 9.53 -> 9.58  (gaps +0.02, +0.05)  accepted - still gaining speed
  # Both series rise, so the old "each close higher" test bought either one.
  # The first shape is a move that has largely already played out, which is
  # exactly what this fast-path signal should not be buying into.
  # Set false to go back to plain rising closes.
  three_bar_require_acceleration: true

  # --- Opening reversal (U-shape) entry ---
  # Catches the OPPOSITE pattern from every signal above: a stock that DROPS
  # at the open, bottoms out, then reverses upward - a U or V shaped
  # recovery. None of the other three entry paths can ever detect this,
  # since they all require an UPWARD move to even start watching a symbol.
  # OFF by default - new, unproven logic that hasn't run live even once yet.
  # Both the drop and the bounce are confirmed via consecutive-bar counting
  # (see _check_consecutive_bar_pattern) - the same "N clean bars in a row,
  # not just one tick" discipline use_three_bar_momentum already uses for
  # its up-signal, applied here in both directions.
  use_opening_reversal_entry: false
  opening_reversal_window_minutes: 5    # only watch for the INITIAL drop within this many minutes of market
                                         # open - an "opening dip" stops meaning anything once the morning's
                                         # well underway, so no new decline-tracking starts after this
  opening_reversal_drop_bars: 5         # consecutive red (declining) 1-min bars that counts as "a drastic
                                         # drop" worth watching (not just normal noise)
  opening_reversal_confirm_bars: 5      # consecutive green (rising) 1-min bars off the tracked low needed
                                         # to confirm the reversal is real and buy

  # volume_spike_multiplier: 1.5  # NOT CURRENTLY USED (kept here for reference).
  # The old entry check required a single 5-minute bar's volume to be >= 1.5x
  # a full TRADING DAY's average volume - a unit mismatch (5 minutes of volume
  # vs. ~390 minutes of average volume) that was almost never satisfiable.
  # Dropped in favor of the rapid_increase_* price-based check above.

  # --- Exit parameters ---
  # Checked in this priority order every exit-monitoring pass (~once per minute
  # live): final_exit > first_exit > momentum_fade > resistance > trailing_stop
  # > time_stop. The first one that fires wins for that pass.
  final_exit_loss_pct: -1.0    # Hard stop: sell ALL remaining shares if price falls this much from entry (%)
  first_exit_loss_pct: -0.5    # Scale-out: sell first_exit_pct of the position if price falls this much from entry (%)
  first_exit_pct: 0.33         # Fraction of the original position sold on the first_exit_loss_pct trigger above
  # Raised 0.75 -> 1.35 on 2026-08-24 at the user's request. NOTE THE
  # COUNTER-EVIDENCE, recorded here so it is easy to revert: a wider trail goes
  # INERT for any position whose peak stays below +0.35%, because the trail level
  # then sits under the -1.0% final exit. On 2026-08-24, 5 of the 9 trailing-stop
  # exits had peaks below that, and 3 never traded above the entry price at all -
  # for those the 0.75% trail was acting as a stop TIGHTER than the final exit
  # and was saving money (HOOD left at -0.42%, not -1.0%).
  #
  # The argument FOR widening is the other four: DASH, ADBE and ADSK reached
  # +0.5-0.6% and were cut for small losses before the +1.0% take-profit tier
  # could fire. Whether they would have recovered is not knowable from the log.
  #
  # If this session is worse, revert to 0.75 and use breakeven_trigger_pct
  # instead (PENDING_WORK item 1c) - a floor at entry solves the same problem
  # without disabling the trail on positions that never go green.
  # Once the PEAK reaches breakeven_trigger_pct, the stop never goes below
  # entry + breakeven_floor_pct. Added 2026-08-25 to fix what the 1.35% trail
  # could not: CHWY peaked +0.98% and closed -0.41%, CRM +0.93% -> -0.67%, COIN
  # +1.32% -> -0.23%. All three would have closed at ~breakeven with this on.
  # The floor is slightly positive so the exit spread does not turn "breakeven"
  # into a small loss.
  use_breakeven_floor: true

  # Fallbacks, used only when breakeven_tiers below is absent or unusable.
  breakeven_trigger_pct: 0.5
  breakeven_floor_pct: 0.05

  # Tiered breakeven, added 2026-08-26.
  #
  # Each tier arms when the PEAK since entry reaches trigger_pct, and once armed
  # exits the whole position if price falls back to entry + floor_pct. Where a
  # peak has passed several triggers the HIGHEST floor wins, so adding a low
  # tier can never loosen what a higher one already gave.
  #
  # Why the second tier exists. On 2026-08-26 the positions that went green but
  # stopped short of +0.5% - the old single trigger - lost $293.10 across eight
  # positions with zero winners among them. That was the largest recoverable
  # bucket of the session. Sized against that day, by trigger:
  #
  #     0.40%  ->  2 positions,  $50.21
  #     0.35%  ->  3 positions,  $97.33
  #     0.30%  ->  4 positions, $132.78
  #     0.20%  ->  6 positions, $179.54
  #     0.10%  ->  8 positions, $293.10   (all of them)
  #
  # 0.30 is the chosen point: 0.25 catches nothing 0.30 does not, and below
  # 0.20 the trigger is close enough to noise that nearly any position arms.
  #
  # THE RISK, because it is real and unmeasured. Arming earlier means arming
  # inside the dip momentum entries usually take before they run. All seven
  # tiered winners on 2026-08-26 traded below entry at some point (MAE -0.03%
  # to -0.56%) and none was scratched - their dip came BEFORE the peak crossed
  # +0.5%. A 0.30 trigger reaches into that window. MFE/MAE do not record which
  # came first, so this can only be settled forward: watch the BREAKEVEN_STOP
  # count and the MFE of what it exits. If it starts scratching positions whose
  # MFE later exceeded +1%, raise this back toward 0.5.
  #
  # floor_pct stays at 0.05 rather than 0.0 on both tiers. Exiting at exactly
  # the entry price is not a $0 trade - the sell crosses the spread, so a true
  # zero fills a few cents down. +0.05% is what makes "no loss" mean no loss.
  breakeven_tiers:
    - {trigger_pct: 0.5,  floor_pct: 0.05}
    - {trigger_pct: 0.30, floor_pct: 0.05}

  trailing_stop_pct: 0.75      # Trailing stop: exit ALL remaining shares if price falls this % below the
                                # HIGHEST price seen since entry (not below entry price - protects gains already made)
  time_stop_hour: 16           # Close all positions at this hour (ET) if nothing else has exited yet
  # ...but fire this many minutes BEFORE it. 5 -> 15:55.
  #
  # This used to fire at 16:00:00 exactly, which is the close: a market order
  # submitted then cannot fill during regular hours, so it queued as
  # status=new for the NEXT session. On 2026-09-02 CRM, CTSH and DKS were
  # still open at the next morning's startup with their unfilled 16:00 sells
  # pending - occupying three of ten position slots on a day that wanted
  # them, and adopted at startup as if they were live positions.
  #
  # Set to 0 to restore the old fire-exactly-at-the-hour behaviour.
  time_stop_lead_minutes: 5

  # Momentum fade: bails on a trade that's stalled (flat/negative trend) even
  # without a loss, rather than waiting for it to reverse into one.
  momentum_fade_hour: 10                 # Start checking momentum fade at this hour (ET)
  momentum_fade_minute: 15               # ...and this minute. Combined: 10:15 AM ET by default.
  # Expressed in MINUTES so the rule means the same span of market time at any
  # poll rate. The sample-count key below is the fallback for older configs.
  momentum_fade_window_minutes: 6
  momentum_fade_window_samples: 6        # Number of recent price samples used in the trend calc.
                                          # One sample is taken per exit-check pass (~once per minute
                                          # live), so 5 samples ~= the trend over the last ~4-5 minutes.
  # Loosened 0.0001 -> -0.05. At 0.0001 anything not strictly RISING counted as
  # fading: GRAB exited on a logged slope of exactly -0.000000, and NU - the
  # best trade of 2026-08-19 - was closed at +2.43% on a slope of -0.002.
  # At -0.05 a $50 stock must shed roughly a nickel a minute across the whole
  # sample window before this fires, i.e. an actual downtrend.
  momentum_fade_slope_threshold: -0.05   # Trend is considered "faded" (and the position is closed)
                                          # when the regression slope ($ per sample) drops to or below this.

  # Resistance rejection: a "high, then two lower closes" pattern right at the
  # trade's peak is treated as a failed breakout and exits.
  # Fraction of the lookback window allowed to tick UP and still count as a
  # failed breakout. The old rule demanded every sample be strictly lower, which
  # described a 3-sample window well and an 18-sample one (3 min at a 10s poll)
  # not at all - 18 consecutive down-ticks essentially never happen, so the rule
  # would have gone silent. 0.34 keeps it meaning "clearly falling" at any rate.
  # OFF for the 2026-08-26 session, to measure what this rule is actually worth.
  # The case for looking: it exits the FULL position on a signal that fires very
  # readily, because price_history is seeded with the entry price - so for any
  # position that never trades above its fill (common, since this strategy buys
  # thrusts) the "window opened at the peak" test passes by default. Results so
  # far are mixed rather than bad: -$70.46 over 13 fires on 2026-08-21 but
  # carrying HOOD's +$100.07, and -$38.16 over 4 on 2026-08-24.
  #
  # With it off, those positions fall through to the trailing stop, the
  # breakeven floor, or the -1.0% final exit. Compare the day's TRAILING_STOP
  # and FINAL_EXIT counts against a session with it on.
  # Back ON 2026-08-26 after one session off. The session off did not settle
  # anything: with the rule disabled its exits simply became TRAILING_STOP
  # exits, which is not a measurement of whether it was right.
  use_resistance_exit: true

  resistance_max_uptick_fraction: 0.34
  resistance_lookback_minutes: 3
  resistance_lookback_samples: 3   # Number of recent price samples checked for the failed-breakout
                                    # pattern (oldest sample = peak, must strictly decline from there)
  # Raised 0.3 -> 0.5 on 2026-08-21 from that day's split. RESISTANCE fired 13
  # times: the 6 shallow fires (decline < 0.5%) cost -$5.63 between them, while
  # the 7 real ones carried -$64.83 of genuine deterioration plus HOOD's
  # +$100.07. So the shallow tier is not losing money - it is closing positions
  # that had barely moved, before they can become anything. Requiring half a
  # percent keeps the rule doing its job on real rollovers and stops it
  # harvesting noise.
  resistance_min_decline_pct: 0.5  # ...AND the drop off that peak must exceed this %. Without a floor
                                    # the "strictly declining" test is met by a single cent, so the rule
                                    # fired on noise inside the spread - it exited NFLX on -0.08%,
                                    # UBER on -0.11% and ASTS on -0.14% on 2026-08-19, 14 times in all.
                                    # Set 0 to restore the old no-floor behavior.

  # --- Re-entry cooldown ---
  # After a position closes AT A LOSS, refuse to buy that symbol again for
  # this many minutes. On 2026-08-19 the bot repeatedly stopped out and then
  # bought straight back into the same decline: RGTI -$340 over 4 exits,
  # MRVL -$328 over 3, CLSK -$238 over 4, PLUG -$137, UPST -$134.
  # Set 0 to disable.
  # Lowered from 20 to 5 on 2026-08-21. The cooldown exists to stop the bot
  # re-buying a name it just stopped out of while the same failed move is still
  # unwinding - real, but 20 minutes was sized for a 59-symbol watchlist where
  # there was always another candidate. With the stream capped to ~14 symbols,
  # a 20-minute lockout on a 20-minute entry window means one bad entry
  # retires that symbol for the entire session.
  #
  # NOT set to 0. On 2026-08-19 the bot re-entered the same losing names
  # repeatedly inside a few minutes; with reentry_cooldown_after_loss_only
  # true, this only ever gates a symbol that just LOST, and 5 minutes is
  # enough for the immediate post-stop churn to settle.
  reentry_cooldown_minutes: 5
  reentry_cooldown_after_loss_only: true  # false = cool down after ANY exit. Left true because
                                           # re-entering a name that just PAID was profitable that
                                           # day (UBER +$190 over 2, CHWY +$159 over 4, CMG +$109
                                           # over 2) - only the losing re-entries were the problem.

  # --- Position sizing ---
  # Each entry's dollar budget is the SMALLEST of three ceilings (see
  # _position_size in main.py); shares = budget / price, so a cheap stock
  # simply buys more shares for the same money. Share count is not itself a
  # risk measure - 780 shares of a $12 stock is the same $10k as 40 shares
  # of a $240 stock.
  #
  #   1. equity * max_total_exposure_fraction / max_concurrent_positions
  #      (even slot share - at ~$95k equity: 95000 * 0.9 / 10 = $8,550)
  #   2. equity * max_risk_per_trade_fraction / (final_exit_loss_pct/100)
  #      (largest position whose stop costs <= that fraction of equity)
  #   3. max_position_per_stock_usd (flat backstop)
  #
  # Sizing was previously just ceiling 3 alone - a flat $10,000 into every
  # name regardless of account size, which across 10 slots assumed $100,000
  # committed against ~$95,000 of equity.
  max_position_per_stock_usd: 10000  # Hard $ ceiling per stock (backstop, not the sizing rule)
  max_risk_per_trade_fraction: 0.005 # Max fraction of equity a single stop-out may cost (0.005 = 0.5%).
                                      # Dormant while final_exit_loss_pct is tight (a 1% stop puts this
                                      # well above ceiling 1); it binds once the stop is widened.
  # Pattern-day-trader floor. Below $25,000 equity a margin account is capped at
  # 3 day trades per 5 business days, and this bot does 20-30 in a morning - so
  # below this level it stops OPENING positions. Existing ones are still managed
  # to their own exits; forced selling on an equity dip is the worse outcome,
  # and the rule governs opening trades, not holding them.
  #
  # Inert on a paper account, which is not subject to PDT. It is here so that
  # setting paper_trading: false cannot quietly put the account in violation.
  min_account_equity_usd: 25000

  # 1000 -> 2000 -> 1000 for 2026-09-02. Raised in test to let a session run
  # further before halting rather than cut off early on a small paper account
  # (at 1000 the 2026-08-19 limit would have ended at exit 17 of 71, collecting
  # little data). Set back to 1000 now that measurement isn't the goal.
  #
  # 1000 -> 500 for 2026-09-02, on request. This is a hard-stop CEILING, not
  # an expected-loss target - normal days are meant to cost far less than
  # this and mostly have (worst so far: -546.24 on 08-31). There is no
  # separate "normal day" band yet; this single number does both jobs. See
  # PENDING_WORK.md for tracking realized-loss velocity intraday as a softer
  # warning before this hard cap fires.
  #
  # REMINDER: this is a paper-account number. Before trading with real money,
  # re-derive it from actual account size and real risk tolerance rather than
  # carrying this value over - it was picked to keep a test session running,
  # not as a considered real-money risk limit.
  max_daily_loss_usd: 500  # Stop trading if daily loss exceeds this.

  # ---------------------------------------------------------------------
  # Correlation limiter (added 2026-09-02) - PENDING_WORK backlog item 1
  # ---------------------------------------------------------------------
  # max_positions_per_sector buckets by ETF MEMBERSHIP; this measures actual
  # co-movement. Two names in different sectors can be one bet (a crypto
  # miner and a crypto exchange), and two in the same sector can be genuinely
  # independent - only a correlation says which.
  #
  # Uses the per-symbol price deques the loop already keeps for momentum, so
  # it costs no new data and no API calls.
  #
  # THE THRESHOLD IS DELIBERATELY LOOSE. This can only ever REDUCE positions
  # taken, and breadth is the measured bottleneck - `edge` has been positive
  # on every session including losing ones, which says selection works and
  # opportunity is scarce. At 0.85 it catches near-duplicates (the same bet
  # wearing two tickers), not merely related names. Tighten only on evidence.
  #
  # Fails OPEN everywhere ambiguous: too little history, a flat series, a
  # symbol with no data. Refusing on an unmeasurable correlation would be
  # refusing on no evidence, which is the opposite of the point.
  #
  # Refusals are journalled as skip_reason "correlation_limit" and those
  # signals still carry 15/30-min forward returns - so if this starts
  # blocking winners, the journal shows it rather than hiding it.
  correlation_limit:
    enabled: true
    threshold: 0.85              # Pearson r on per-poll returns
    min_samples: 10              # never refuse on a correlation from noise
    max_correlated_positions: 1  # refuse once this many open positions match

  # ---------------------------------------------------------------------
  # Dynamic ATR/MAE stops (added 2026-09-02) - CALCULATOR ONLY, NOT LIVE
  # ---------------------------------------------------------------------
  # PENDING_WORK backlog item 3. Both inputs became available on 2026-09-02
  # (a true atr_pct from the screener fix, MAE percentiles from the logged
  # mae_pct), so the rule in src/analytics/dynamic_stops.py is built and
  # tested - but it is NOT yet wired into TradeManager, and `enabled: false`
  # keeps it that way.
  #
  # THE RULE (option (b)): use the symbol's OWN MAE percentile once it has
  # min_samples of its own history, else the pooled percentile across all
  # symbols, else the static stop. Blended with an ATR floor so a volatile
  # name is not given a stop inside its own noise.
  #
  # THEN CAPPED: the result can only ever be TIGHTER than
  # final_exit_loss_pct, never wider. This is the safety property. The
  # rejected option (a) - max(ATR, MAE-percentile) - takes the WIDER of two
  # numbers, both of which can exceed 1%, so a 3%-ATR name would get a stop
  # several times looser than today's -1.0%: bigger losses per trade, the
  # opposite of the goal. With the cap the worst case is exactly today's
  # behaviour.
  #
  # Recalculated at MILESTONES (entry, +0.5%, +1.0%), never per tick: a stop
  # recomputed continuously chases price and exits on noise in the level
  # rather than in the market. Monotonic - falling back below a milestone
  # does not re-widen the stop.
  #
  # BEFORE ENABLING: run `python3 ops/mae-percentiles.py` on the VPS and
  # check the per-symbol n. While the dynamic universe reshuffles the pool
  # daily most symbols have far fewer than min_samples, so nearly every
  # symbol would use the pooled distribution - which may be the right call,
  # but it should be a decision made against the real numbers.
  dynamic_stops:
    enabled: false
    min_samples: 15        # own-history trades needed before per-symbol is used
    mae_percentile: 75     # place the stop where 75% of trades stayed within
    atr_multiple: 1.0      # stop must also clear 1x the symbol's ATR%; 0 disables
    min_stop_pct: 0.25     # never tighter than this - the spread alone would trip it
    milestones: [0.0, 0.5, 1.0]

  # ---------------------------------------------------------------------
  # Soft loss-velocity warning (added 2026-09-02)
  # ---------------------------------------------------------------------
  # WARNING ONLY - never halts, never resizes, never blocks an entry. The
  # hard stop above is unchanged.
  #
  # max_daily_loss_usd was doing double duty as both the circuit breaker and
  # the only loss number that exists: the day was either fine or over, with
  # no signal on the way there. That gap matters more at $500, not less -
  # 2026-08-31 closed at -$546.24, which under today's setting would have
  # flattened the book mid-session with nothing said beforehand.
  #
  # warn_fractions are fractions of max_daily_loss_usd: at $500 these fire
  # at -$200, -$300 and -$400. Each fires ONCE per day. The log line carries
  # both the depth (how far to the stop) and the velocity ($/min since the
  # first check, projected to when the ceiling would be hit at that rate) -
  # -$300 by 10:00 and -$300 by 15:30 are the same depth and very different
  # days, and only the second number tells them apart.
  loss_velocity_warning:
    enabled: true
    warn_fractions: [0.4, 0.6, 0.8]

  # --- Burst throttle ---
  # When many symbols signal in the SAME poll they are rarely independent
  # ideas - it is one market move surfacing in many tickers at once. On
  # 2026-08-19 twenty names fired inside nine seconds; that book was not
  # twenty bets but one bet held twenty times, and it went 1 winner / 23
  # exits / -$1,307. Above the threshold the bot takes fewer of them AND
  # sizes each smaller.
  # This limits how much is committed to a single market move. It is NOT
  # diversification and NOT ranking - picking the "best" of a burst needs
  # evidence, which is what the signal journal below is collecting.
  #
  # The cap is PER POLL, not per day, so a burst that keeps signalling still
  # fills the book over successive minutes rather than being blocked outright.
  # Measured against a simulated 20-symbol burst under production caps, the
  # net effect is: the same 10 positions (max_concurrent_positions binds
  # either way) but roughly HALF the capital committed, entered across five
  # polls instead of nine seconds. Staggering is itself worth something -
  # each later poll is a fresh look at whether the move is still intact.
  use_burst_throttle: true
  # The market's own move as a burst detector, which is strictly better than
  # counting signals and costs nothing - SPY is already sampled every poll.
  # If SPY has moved this much over the signal window, the poll is treated as a
  # market event and throttled regardless of how many symbols fired.
  #
  # Counting misses the case this catches: three names firing during a sharp
  # market lurch are exactly as correlated as twenty, and burst width alone
  # would wave them through at full size. 0 disables it.
  market_burst_spy_pct: 0.4

  burst_width_threshold: 5    # this many simultaneous signals counts as a burst
  burst_max_entries: 3        # take at most this many of them
  burst_size_multiplier: 0.5  # and size each at this fraction of normal

  # --- Take profit (EXPERIMENTAL - added 2026-08-20 for the 08-21 session) ---
  # Sell take_profit_fraction of the position once it is up take_profit_pct.
  # Fires at most once per position; the remainder keeps running under the
  # trailing stop.
  #
  # THE 2026-08-20 DATA ARGUES AGAINST THIS. Only 3 of 25 trades that day ever
  # reached +1%, and those three were the entire day's profit (MARA +$121,
  # RIOT +$59, LYFT +$44). Trimming half of each would have clipped the only
  # winners while doing nothing for the other 22 trades, which never got near
  # the trigger. It is on to be measured, not because the evidence supports it.
  # Compare take_profit_pct against the mfe_pct column in trade_history.csv
  # before keeping it past the 08-21 session.
  use_take_profit: true

  # Tiered scale-out. Each tier fires AT MOST ONCE per position, and firing one
  # retires every tier below it - otherwise a position that ran to +1.3% and
  # pulled back to +1.0% would sell AGAIN on the way down, which is scaling into
  # weakness rather than out of strength.
  #
  # sell_fraction is a fraction of the ORIGINAL position, so 0.33 + 0.40 means
  # 73% of what was bought, regardless of what earlier tranches took. A fraction
  # of 1.0 means "all remaining", which is how the top tier closes the position.
  #
  # If price gaps straight through several tiers the HIGHEST qualifying one
  # fires: a jump to +1.6% sells the whole position rather than trickling out
  # 33% and leaving the rest to a rule that may never trigger again.
  #
  # Evidence for this shape: on 2026-08-21 take-profit fired 7 times for 7
  # winners (+$150.63 of $455 gross profit), but the single +1.0% tier clipped
  # the two best trades - HOOD ran to +4.66% and SOFI to +3.46% AFTER selling
  # half at ~+1%. Tiering keeps the early certainty while leaving a third of the
  # position free to run past +1.5%.
  # 0.33/0.40/1.0 -> 0.40/0.30/1.0 for 2026-09-02, on request: take more off
  # the first tier, leave the same 30% free to run past +1.5% (the top tier
  # is "sell everything left," so it is still 30% of the original either way -
  # 0.40 + 0.30 = 0.70 taken, 30% remaining, same shape the old 0.33/0.40 gave,
  # weighted earlier.
  take_profit_tiers:
    - {gain_pct: 1.0,  sell_fraction: 0.40}   # take 40% off early
    - {gain_pct: 1.25, sell_fraction: 0.30}   # 30% more of the original
    - {gain_pct: 1.5,  sell_fraction: 1.0}    # close out whatever is left

  # Legacy single-tier form, used ONLY if take_profit_tiers is absent. Kept so
  # an older config still works unchanged.
  take_profit_pct: 1.25
  take_profit_fraction: 0.5

  # --- Exposure caps ---
  # Checked BEFORE every entry attempt (see Executor.pre_entry_check) - the
  # bot will never even try to submit an order that would breach either of
  # these, rather than relying on the broker's margin engine to eventually
  # reject it once out of room. This is what let the account run to ~2.8x
  # leverage across 28 simultaneous positions on 2026-08-18 before anything
  # stopped it - Alpaca's own rejection was the only backstop that existed.
  max_concurrent_positions: 10      # never hold more than this many positions open at once

  # Never hold more than this many positions in ONE sector complex at once.
  #
  # The screener does not pick a sector; volatility does. rapid_increase fires
  # on whatever is moving most, and high-beta names cluster - on 2026-08-28
  # crypto miners fired MARAx21, RIOTx17, CIFRx17 and took 9 of 30 positions,
  # returning 0 winners for -$131. On 2026-08-27 the same complex was +$318 on
  # 4 of 4. Two sessions, opposite results, one underlying bet: the day was a
  # sector call sized as if it were nine independent ones.
  #
  # 3 of 10 slots. Complexes come from src/analytics/sectors.py (12 ETF
  # buckets); an UNMAPPED symbol is never refused, since lumping every unknown
  # name into one phantom bucket would starve them all.
  #
  # This is a real behavioural change, not a measurement one: it will refuse
  # entries that previous sessions took. Expect fewer positions on days when
  # one complex dominates, and check the "P&L by sector complex" table to see
  # whether the refused slots would have helped or hurt.
  max_positions_per_sector: 3

  # Stop opening new positions when the names we trade are broadly falling.
  #
  # A BANDAID, and named as one. The strategy is long-only and needs
  # continuation. On 2026-08-28 SPY was flat (-0.018%) while the average signal
  # returned -1.045% at 15 minutes; 19 of 30 positions never got above +0.5%.
  # The day lost $250 and STILL beat the do-nothing benchmark by 1.03pp -
  # selection was working, there was just nothing to select from. No amount of
  # better picking fixes a tape with no upside in it.
  #
  # This does not predict the day. At check_time it reads what the watchlist has
  # already done since the open, and if the mean is below min_mean_pct it stops
  # opening anything new for the rest of the session. Exits are untouched.
  #
  # THE ASSUMPTION, stated so it can be tested rather than believed: that a weak
  # first ten minutes implies a weak session. That is not measured - it is the
  # thing this setting is here to measure. It WILL sometimes halt a day that
  # goes on to recover, and the cost of those days is invisible in the P&L
  # (a trade not taken leaves no row). Read the BREADTH CHECK / BREADTH HALT log
  # line against the rest of the session before trusting it.
  #
  # Latched once evaluated - a bounce does not un-halt the day, because that
  # would reopen trading on the same evidence that closed it.
  breadth_halt:
    enabled: true
    check_time: "09:45"      # 15 minutes of tape, paired with the 10:00 window end
    min_mean_pct: -0.3       # halt if the watchlist mean is below this
    min_symbols: 5           # never conclude anything from fewer than this many

  # ---------------------------------------------------------------------
  # Regime-scaled position sizing (added 2026-09-02)
  # ---------------------------------------------------------------------
  # REPLACES breadth_halt's binary trade/don't-trade with a smooth size
  # multiplier - 100% bullish, 50% neutral, 15% (of the 0-25% range asked
  # for) bearish - so a weak tape shrinks new entries instead of refusing
  # every remaining signal for the day.
  #
  # Directly serves the thing 2026-08-28's session proved: `edge` (taken vs.
  # do-nothing) was positive on that day AND on losing days generally -
  # selection is working, what's missing is breadth, i.e. enough qualifying
  # moves to select from. A hard halt makes "nothing to select from"
  # literally true by refusing every remaining signal outright, even a
  # genuinely good one. Scaling size instead keeps taking signals - fewer,
  # smaller - which is strictly more breadth for the same risk-management
  # intent (don't commit full size into a tape with no upside in it).
  #
  # breadth_halt stays enabled ABOVE, on purpose: its measurement (mean move
  # since the open) is reused as one of the two regime inputs below, and
  # keeping it on costs nothing - see the call site in main.py's
  # run_trading_day, which computes breadth_halt's evidence every time but
  # only lets it actually HALT when this block is disabled. Turning this
  # off reverts to breadth_halt's original behavior with no other change.
  #
  # Uses SPY's own move since the open as the second input (broad-market
  # trend), not QQQ - SPY is already the market proxy used everywhere else
  # in this file and is already streamed; QQQ is not currently subscribed to
  # anything. A second index is real future work, not a blocker to shipping
  # this with one - see PENDING_WORK.md.
  #
  # UNPROVEN, same status breadth_halt shipped with: the assumption that a
  # weak/strong first 15 minutes says anything about the rest of the
  # session is what this measures, not what it starts from. Watch the
  # REGIME log line against the rest of each day's session-metrics.
  # PRIMARY RULE, as of 2026-09-02: SPY and QQQ against their OWN session
  # VWAP. Price above VWAP means the session's average buyer is in profit -
  # a cleaner read on "is the tape supporting longs" than a move measured
  # from a single opening print, which one gap or one bad tick can dominate.
  # VWAP is also the level institutional flow is actually benchmarked
  # against, so the market reacts to it rather than it being imposed.
  #
  #   both above VWAP  -> BULLISH, full size
  #   one above        -> NEUTRAL, half size. The indices disagreeing IS the
  #                       neutral case, not a weak bullish one.
  #   both below       -> BEARISH, and the default is 0.0: NO NEW LONGS.
  #                       A long scalp with both indices under VWAP is
  #                       fighting the tape, and there is no requirement to
  #                       trade every day. Set 0.25 to take quarter size
  #                       instead of standing down - but test standing down
  #                       first, which is the stronger claim and the cheaper
  #                       mistake if wrong.
  #
  # Requires QQQ streamed (added to _benchmark_symbols the same day) - a
  # regime read off a REST-delayed QQQ would answer "was QQQ above VWAP a
  # quarter of an hour ago".
  #
  # bearish_below_pct / bullish_above_pct below are the FALLBACK rule, used
  # only when an index has no VWAP yet (it needs bars carrying volume, and a
  # benchmark that fell back to REST may never accumulate any). Falling back
  # to "no opinion" would mean full size on no evidence, in exactly the
  # situation this feature exists for.
  regime_sizing:
    enabled: true
    check_time: "09:45"        # same evidence window as breadth_halt
    bullish_multiplier: 1.0
    neutral_multiplier: 0.5
    bearish_multiplier: 0.0    # 0 = no new longs. 0.25 = quarter size instead.
    # Fallback-only thresholds (no VWAP available):
    bearish_below_pct: -0.3    # either reading below this -> bearish
    bullish_above_pct: 0.0     # BOTH readings at/above this -> bullish

  # Total positions OPENED over the whole day, regardless of how many are held
  # at once - a different limit from max_concurrent_positions above. On
  # 2026-08-19 the concurrent cap of 10 held, yet 54 buys still went through in
  # ~21 minutes, because positions kept closing and new ones opening in their
  # place. This caps that churn. Set to 0 (or remove) for unlimited.
  # Only entries are blocked once the cap is hit - exit monitoring continues,
  # so open positions are never left unprotected.
  # Raised 25 -> 50 for data collection. 2026-08-19 ran UNCAPPED and took 54
  # entries, so 25 would have collected less than half of a day that was
  # already considered too small a sample. 50 gives a comparable sample while
  # still cutting the tail of pure churn.
  # NOTE: this is very unlikely to be the binding constraint - see
  # max_daily_loss_usd. The loss limit now actually fires (it never once did
  # before), and on 2026-08-19 numbers it would have ended the session around
  # entry 40, before this cap was ever reached.
  max_daily_entries: 50

  max_total_exposure_fraction: 0.9  # never commit more than this fraction of CURRENT equity, combined,
                                     # across all open positions - a fraction (not a fixed $) so it scales
                                     # automatically with account size instead of needing to be re-tuned

  # Stock universe (can be dynamic or static)
  # When FALSE, stock_universe is a CANDIDATE POOL rather than an auto-include:
  # its names are scored by the screener alongside candidates_file, and only the
  # ones that earn a top-N place get watched.
  #
  # Until 2026-08-21 this was effectively true: 8 screener picks were merged
  # with all 50 defaults, so 50 of 56 watched symbols had passed no test at all.
  # That matters far more now that the WebSocket budget is ~14 symbols - a
  # watchlist of 56 meant three quarters of what could be traded was running on
  # ~15-minute-delayed REST prices, which is exactly the condition that produced
  # entries at the 87th percentile of the surrounding half-hour.
  #
  # Safety: if the screener errors, times out, or finds nothing above
  # min_screener_score, the full static list is still used. An unfiltered
  # watchlist beats an empty one.
  merge_default_universe: false

  # ---------------------------------------------------------------------
  # Dynamic universe (added 2026-08-26)
  # ---------------------------------------------------------------------
  # Screen the market instead of a list someone typed once.
  #
  # Until now the candidate pool was candidates.txt (50 names) plus
  # stock_universe (50 names), and the screener picked 15 from those. So the same
  # tickers came back every session: on 2026-08-26 every symbol traded except
  # ADBE and CMG was in the hardcoded list. The screener was not finding the best
  # stocks, it was ranking a list.
  #
  # The funnel, and why it is affordable:
  #
  #     ~11,000 tradable assets    one request (get_all_assets)
  #       -> liquidity+price cut   one BATCHED daily-bar sweep
  #       -> universe_size         cheap scoring, no further requests
  #       -> universe_shortlist    the expensive per-symbol scoring
  #       -> num_stocks_to_trade   traded
  #
  # get_historical_bars already accepted a list and passed it to Alpaca's
  # multi-symbol endpoint; the screener just never used it, looping one symbol at
  # a time at ~6 calls each. Batched, a thousand symbols costs requests
  # proportional to 1000/universe_chunk_size, not to 1000.
  #
  # This changes WHICH symbols get traded, not how many. The stream budget is
  # still stream_max_subscriptions and the count is still num_stocks_to_trade.
  # That is the intent - on 2026-08-26, 12 of 22 positions went the wrong way
  # immediately - but it is not a route to more trades.
  #
  # Falls back to the static pool on ANY failure. An unfiltered watchlist beats
  # an empty one.
  # OFF for 2026-08-28. Kept off deliberately, not because it is broken.
  #
  # The reasoning below is why it is worth turning ON later; the reason it is
  # off now is simply that 2026-08-27 was the first profitable session, it ran
  # on the 92-name pool, and the opening-move burst has never once executed. One
  # new variable per session. Turn this on once the burst has produced evidence.
  #
  # It was briefly parked to keep the symbol pool constant while the
  # opening-move burst was tested. Two things make that caution unnecessary.
  #
  # First, the point of a screener is to search. A fixed 92-name pool
  # (stock_universe + candidates.txt) caps what can ever be found no matter how
  # good the scoring is - the top 15 change daily, but only ever from those 92.
  # The dynamic build screens ~1,000 liquid names from the whole market instead.
  # The evidence that this matters is already in hand: on 2026-08-27, 5 of the
  # 14 symbols traded (MSTR, HMY, CMBT, NFLX, ABNB) came from the earnings and
  # QQQ lists rather than the static pool, and those five produced +$337 of a
  # $535 day. Names from outside the fixed pool were most of the profit.
  #
  # Second, attribution no longer requires holding it still. session-metrics now
  # splits P&L by ENTRY TIME (opening window versus the rest of the session), so
  # the burst's contribution is separable from the pool's even when both change.
  #
  # The failure mode is safe: a build that produces nothing falls back to the
  # static pool, which is exactly what happened on 2026-08-27 - the session
  # traded normally and profitably while this silently did nothing. So the
  # downside of it failing again is a day identical to today's.
  #
  # WHAT IS NOT YET PROVEN: this has never once completed successfully against
  # the live broker. The DataFrame parsing bug that made it return nothing is
  # fixed and tested, but tested against synthetic frames matching the shape
  # get_historical_bars documents - not against Alpaca. Tomorrow is its first
  # real run either way. Watch for "DYNAMIC UNIVERSE: N liquid -> top 100" in
  # the log; its absence means it fell back again.
  # Turned ON for 2026-08-31.
  #
  # Friday's constraint was not the signal, it was the pool: UBER and SPCE
  # traded well through the first 20 minutes and could never have been selected,
  # because they were not among the 92 hand-written names. ~11,000 tradable US
  # equities go in, a dollar-volume floor and a cheap score cut them to
  # universe_shortlist_size, and the static pool is folded in and re-ranked on
  # merit so nothing is privileged by having been typed by hand.
  #
  # THIS DOES NOT HELP THE OPENING BURST, and may hurt it: the burst can only
  # measure the 14 symbols the IEX stream serves, and a wider watchlist means a
  # smaller fraction streamed. Monday is running both experiments at once, so
  # read the burst's readiness ramp on its own terms and do not let a change in
  # the pool be mistaken for a change in stream coverage.
  #
  # universe_rank is now recorded per entry, so "are the top-ranked names
  # actually better?" is answerable from outcomes: correlate rank against
  # realised P&L. If ranks 1-14 do no better than 80-100, the cheap score is
  # sorting noise.
  use_dynamic_universe: true

  # How many symbols survive the liquidity cut and get cheap-scored.
  universe_size: 1000

  # How many of those get the EXPENSIVE per-symbol scoring (minute bars for
  # opening-move history). This is the setting that costs time: it multiplies
  # against screener_timeout_seconds below. 100 roughly doubles what the old
  # 50-name pool cost, which is why the timeout moved from 420s to 900s.
  universe_shortlist_size: 100

  # Hard cap on how many symbols the EXPENSIVE screener scores in a session.
  #
  # Measured on 2026-08-27: 92 candidates took 151.8s, so ~1.65s each. The
  # static pool alone is now ~360 names, which would be ten minutes of a
  # twenty-five minute pre-open window - and every minute it overruns is a
  # minute the QQQ list and the stream subscription do not get. 250 is ~7
  # minutes, which fits with room.
  #
  # Applies whether the dynamic universe is on or off. The dynamic shortlist is
  # ordered best-first by cheap score, so a cut takes the worst.
  max_screen_candidates: 250

  # Minimum average daily dollar volume. Dollar, not share, volume: 10M shares
  # of a $2 stock and 10M of a $200 one are not the same market and only one can
  # absorb a position without moving it.
  # 20M -> 50M for 2026-08-27. The opening-move experiment needs names that
  # actually trade in the first minutes: on the IEX feed, which carries ~2% of
  # consolidated volume, a thin symbol may not print for tens of seconds, and a
  # symbol that does not print reads as FLAT - which reads as "do not buy". That
  # would skip names for a data reason rather than a market one.
  #
  # Note this raises the floor, not the ranking. cheap_score already weights
  # atr_pct at 35 and the volume surge at 25, so movement is what ORDERS the
  # universe; this only decides what is allowed into it. Roughly 600-900 US
  # equities clear $50M/day against ~1200-1500 at $20M, so at this floor
  # universe_size (1000) stops being the binding constraint and liquidity does.
  # 50M -> 3M for 2026-09-01.
  #
  # On 2026-08-31 this cut 10,999 scored symbols down to SIXTY-FOUR, against a
  # universe_size of 1000. The dynamic universe therefore contributed almost
  # nothing: the merged pool was 144 names of which 77 were the static list, so
  # the "wider pool" was mostly the pool it was meant to widen.
  #
  # The cause is a unit mismatch. Free-tier historical bars are IEX-ONLY, and
  # IEX carries roughly 2% of US consolidated volume, so a $50M floor measured
  # on IEX volume is asking for about $2.5B of real volume - which only a few
  # dozen names do. 64 of 11,000 is exactly the shape that predicts.
  #
  # 3M on IEX is roughly $150M consolidated, which is a genuine liquidity floor
  # rather than a mega-cap filter. The real selection is the `top_n` sort by
  # dollar volume that follows (universe_size, 1000) - this floor is only a
  # sanity guard against illiquid names, and it was doing the sorting instead.
  #
  # CHECK THIS IN THE LOG: "universe: N symbols after the liquidity cut". If N
  # is still under a few hundred, the floor is still wrong; if it is ~1000, the
  # cut is being made by universe_size as intended.
  universe_min_dollar_volume: 3000000

  # Symbols per batched bar request. A too-large request fails as a whole and
  # takes its chunk with it, so this bounds the blast radius of one bad response.
  universe_chunk_size: 200

  # The liquidity cut answers "what is liquid enough to trade", which changes
  # over weeks. Rebuilding it daily would spend the pre-open window re-deriving
  # yesterday's answer. Cheap SCORES are never cached - those are today's tape.
  universe_cache_file: "logs/universe.json"
  universe_cache_days: 7

  use_daily_screener: true  # Set to true to dynamically select stocks each day
  screener_start_time: "09:05"  # ET. Screener runs PRE-MARKET so the symbol list is ready
                                 # at the bell. It previously waited for the market to open
                                 # first, which burned the first ~2.5 min of the entry window.
                                 # Leave enough headroom for screener_timeout_seconds below.
  candidates_file: "candidates.txt"  # File with candidate symbols
  num_stocks_to_trade: 15  # Number of top stocks to select each day
  # ---------------------------------------------------------------------
  # Opening-move history (added 2026-08-21)
  # ---------------------------------------------------------------------
  # Scores a symbol on how it has ACTUALLY behaved in the first N minutes of
  # recent sessions, rather than on proxies for it. Gap says a catalyst exists,
  # volatility says the name can move, volume says people are present - this
  # measures the outcome all three are trying to predict: did this stock
  # actually run in the first half hour, and how often.
  #
  # Costs one extra API call per symbol (minute bars for the whole lookback
  # arrive in a single request), roughly +15% screening time.
  #
  # TREAT THE WEIGHT AS PROVISIONAL. "Patterns repeat" is a hypothesis. Five
  # observations per symbol is thin evidence, and a name that popped four
  # mornings running may reflect a hot sector that week rather than anything
  # durable. Gap looked equally compelling and turned out NEGATIVE at the tail
  # (MRVL had the largest gap of 2026-08-19 and was the second-worst symbol).
  # The stats are written to the signal journal whether or not they are scored,
  # so after ~2 weeks the claim can be checked against forward returns. If it
  # does not hold, set opening_move_points to 0 - nothing else changes.
  # Stream slots go to the HIGHEST-SCORING symbols, not to whichever sorts
  # first. Those slots are the difference between a live price and a
  # ~15-minute-old one, so they belong to the names most likely to produce the
  # move this whole strategy exists to catch.
  use_opening_move_score: true
  opening_move_lookback_days: 5      # how many recent SESSIONS to measure
  opening_move_window_minutes: 30    # minutes after 09:30 ET to look inside
  opening_move_target_pct: 1.0       # a session "hits" if it gains this much
  opening_move_points: 15            # max points (other components: 25/25/20/20)
                                     # 0 disables scoring but keeps the logging

  min_screener_score: 35  # Minimum score to trade (0-100)
  # 420 -> 900 for the dynamic universe: universe_shortlist_size is 100, roughly
  # double the old 50-name pool, and the expensive stage scales with it. The
  # window still fits - the screener starts at 09:05, so 900s finishes by 09:20,
  # ahead of the 09:28 list build and the 09:33 entry window.
  screener_timeout_seconds: 900  # hard cap on the screener. With ~50+ candidates,
                                  # each scored via several sequential API calls (including
                                  # a yfinance earnings lookup), the screener can run slow.
                                  # If it hasn't finished by this deadline, it's aborted and
                                  # the bot falls back to the static stock_universe list below
                                  # rather than eating into the entry window.

  # ---------------------------------------------------------------------
  # Pre-open list augmentation (earnings + QQQ), added 2026-08-21
  # ---------------------------------------------------------------------
  # A SECOND pre-market stage, run in the buffer between the screener and the
  # bell. Both lists are scored, cut to their best N, and ADDED to the day's
  # watchlist - they never replace or displace what the screener picked.
  #
  # Runs later than the screener on purpose. Earnings reactions need pre-market
  # prints to have accumulated, and the QQQ trend read is a read of TODAY's
  # tape; at 09:05 both would be measuring an empty book.
  #
  # Moved 09:20 -> 09:28 on 2026-08-26. Two reasons, one for each list. The
  # earnings list reads Nasdaq's published EPS surprise, and at 09:20 that
  # figure is usually still blank for a before-the-bell reporter - on 2026-08-26
  # all 15 candidates were dropped as "surprise not published yet". Eight more
  # minutes is eight more minutes for the wire to land. The QQQ trend read and
  # the pre-market gap measurement both also get a fuller book. The deadline is
  # the 09:33 entry window, so 09:28 still leaves five minutes of slack for a
  # slow calendar fetch (earnings_calendar_timeout_seconds: 20).
  list_builder_start_time: "09:28"

  # The QQQ list runs in its OWN, much earlier slot.
  #
  # The two lists have opposite timing needs and sharing 09:28 cost an entire
  # session's experiment on 2026-08-27. Earnings must be late (it reads a
  # published EPS surprise, often not on the wire before ~09:28) and is fast -
  # 2 seconds for 10 candidates. QQQ scores every constituent one at a time and
  # took 3 minutes 17 seconds for 98 of them, while needing nothing that only
  # exists late.
  #
  # Run together they finished at 09:31:50, which did not merely delay the list:
  # it blocked the trading loop, so the 09:30-09:32 opening-move window could
  # not start until it had almost passed, and the stream - gated on the same
  # thing - subscribed 110 seconds after the baseline instant with zero bars.
  # The burst measured 0 of 28 symbols and took nothing.
  #
  # 09:10 leaves ~20 minutes, comfortably more than the ~3.5 the QQQ pass needs,
  # and the screener has finished by ~09:18 either way.
  qqq_list_start_time: "09:10"

  # Hard deadline for the LATE (earnings) slot, as seconds before the open.
  # It is fast, so this is a backstop rather than a routine cut - but a list
  # arriving after the bell is worth less than the minutes it costs, and the
  # screener's picks are the same fallback a screener timeout uses.
  augment_deadline_buffer_seconds: 20

  # Earnings list: today's before-the-bell reporters plus yesterday's
  # after-the-bell ones - i.e. only the names whose news is already priced-in
  # to pre-market. A company reporting after TODAY's close has no catalyst at
  # 09:35, so it is excluded.
  #
  # Source is Nasdaq's free public earnings calendar (no API key). If it is
  # unreachable the list is simply empty and the watchlist is unchanged.
  use_earnings_list: true

  # Only trade an earnings name that BEAT and has NOT already made the move.
  #
  # A miss gaps a stock DOWN and this strategy is long-only, so a company that
  # missed is not a candidate at any price. A name already up 6% pre-market has
  # spent its catalyst: on 2026-08-21 BKE gapped +6.68% and BEKE +5.21%, and
  # those two plus BJ cost -$144.30 on a day that lost $30.78 in total. Without
  # them the session was PROFITABLE.
  #
  # A symbol whose surprise cannot be read is KEPT, not dropped - Nasdaq often
  # has not published EPS for a before-the-bell reporter by 09:20, and treating
  # unknown as a miss would empty the list most mornings.
  earnings_require_beat: true

  # Also drop names whose EPS surprise cannot be read at all.
  #
  # Nasdaq frequently has not published EPS for a before-the-bell reporter by
  # the time this runs, so "unknown" usually means "too early", not "bad" -
  # which is why this is separate from earnings_require_beat.
  #
  # History: turned ON 2026-08-25 on the strength of a single data point (PDD,
  # 2026-08-24, "surprise unknown", -$86.56). Turned back OFF 2026-08-26, when
  # it became clear the filter is not selective but total: it dropped 15 of 15
  # candidates that morning, and would drop essentially every morning's list,
  # making the whole earnings feature permanently inert. One losing trade is not
  # enough evidence to delete a feature outright.
  #
  # The gap filter below is the part of this that has real evidence behind it -
  # it blocked XPEV +3.32%, NSSC +19.07% and GGR +8.99%, all names that had
  # already spent their catalyst - so it stays at 3.0%. That, plus
  # earnings_require_beat, is the screen; "unknown" is no longer a veto.
  earnings_require_known_beat: false
  earnings_max_gap_pct: 3.0
  earnings_list_top_n: 3
  earnings_calendar_timeout_seconds: 20

  # QQQ list: the Nasdaq-100 constituents in src/screener/qqq_constituents.txt,
  # used ONLY on days QQQ is itself trending up (gap, N-day return and price-vs-
  # average, majority of three). On a flat or falling index these names are
  # heavily correlated, so adding 10 of them is one bet held ten times rather
  # than ten bets - the trend gate is what keeps that from happening daily.
  use_qqq_list: true
  qqq_list_top_n: 10
  qqq_trend_lookback_days: 5

  # Default stock universe. Watched EVERY DAY no matter what - merged with
  # (not replaced by) whatever the daily screener additionally picks. Also
  # used directly when use_daily_screener is false, and as the fallback if
  # the screener errors, times out, or returns zero candidates.
  stock_universe:
    # Back to the ORIGINAL 50 for 2026-08-28, deliberately.
    #
    # 2026-08-27 was the first profitable session (+$534.60) and it ran on a
    # 92-symbol pool: these 50 plus candidates.txt plus the earnings/QQQ adds.
    # The next session is testing the OPENING-MOVE experiment, which has never
    # once executed - so the symbol pool is held constant to keep that the only
    # new variable. Changing the pool and the entry mode together would make a
    # bad day unattributable to either.
    #
    # The 311-name pool and use_dynamic_universe are not abandoned - they are
    # parked. Turn both back on once the opening burst has produced a session
    # of evidence. The 311 list is in git at 8a43124 if it is wanted back.
    #
    # Quoted because YAML 1.1 reads bare ON, OFF, YES and NO as booleans.
    - "UBER"
    - "LYFT"
    - "ABNB"
    - "DASH"
    - "RBLX"
    - "PLTR"
    - "HOOD"
    - "COIN"
    - "SOFI"
    - "SNAP"
    - "ROKU"
    - "CVNA"
    - "RIVN"
    - "U"
    - "AFRM"
    - "UPST"
    - "MARA"
    - "RIOT"
    - "CLSK"
    - "HUT"
    - "CIFR"
    - "WULF"
    - "BITF"
    - "LCID"
    - "NIO"
    - "XPEV"
    - "LI"
    - "PINS"
    - "DKNG"
    - "BMBL"
    - "CHWY"
    - "MTCH"
    - "GME"
    - "AMC"
    - "TLRY"
    - "CGC"
    - "PLUG"
    - "FCEL"
    - "RUN"
    - "IONQ"
    - "SOUN"
    - "RGTI"
    - "AI"
    - "RKLB"
    - "ASTS"
    - "OPEN"
    - "CART"
    - "GRAB"
    - "NU"
    - "FUBO"
  # it explodes at low prices - and every stop here is a percent. At PLUG's
  # $2.19 a penny is 0.46%, which eats 92% of the distance to the -0.5% first
  # exit, so the position sits at its stop the moment it fills. Sub-$10 names
  # went 16 trades / 1 winner / -$623 on 2026-08-19, 36% of the day's loss
  # from 23% of its trades. Deliberately 10 rather than 15: NU at $14.38 was
  # the day's best trade (+$279), and a threshold tuned finely enough to
  # exclude it is fitting noise on a 71-trade sample.
  min_stock_price: 10
  max_stock_price: 300

  # ---------------------------------------------------------------------
  # Untradeable symbols (added 2026-09-02) - PENDING_WORK item 0d, bullet 3
  # ---------------------------------------------------------------------
  # Open as a theoretical concern since 2026-08-21, EVIDENCED 2026-09-01:
  # SOXL and TQQQ were both on the watchlist and SOXL was the FIRST
  # opening-burst entry of the day (39 shares @ 106.50), inside a 4-trade
  # 0W/4L opening block.
  #
  # Two distinct reasons, both in src/screener/exclusions.py:
  #   1. A basket cannot burst the way a single name can. The entry thesis is
  #      an unpriced single-name catalyst; an index's move is the average of
  #      its holdings. It also defeats the sector cap - SOXL IS the semi
  #      complex, held alongside INTC/NVDA/KLAC (all watched 09-01) that is
  #      one bet counted four times.
  #   2. Leverage breaks every percentage threshold here. Each stop and tier
  #      is a percent; a 3x fund hits the -0.5% first exit on a -0.17% move
  #      in the underlying. Noise, not a decision - and the same fund clears
  #      min_move_pct trivially, so it keeps qualifying and keeps being
  #      bought.
  #
  # max_stock_price: 300 blocks QQQ at ~$711 BY ACCIDENT. A leveraged fund at
  # $106 sails straight through, which is exactly what happened.
  #
  # Enforced at three layers, mirroring the price band: screener (before
  # ranking, so an excluded name cannot take a top-N place or a stream slot),
  # watchlist (catches names arriving via the static universe / earnings /
  # QQQ lists), and entry time (last check before real money moves).
  exclude_leveraged_etfs: true
  exclude_basket_etfs: true
  # Extra names beyond the two lists above. Symbols here are always refused.
  exclude_symbols: []
  min_avg_volume: 1000000  # Minimum average daily volume

broker:
  paper_trading: true  # Set to false for live trading
  base_url: "https://paper-api.alpaca.markets"  # Paper trading endpoint

logging:
  level: "INFO"
  log_file: "logs/trading.log"

notifications:
  # ---------------------------------------------------------------------
  # SMTP - the original path. OFF, because it cannot work here.
  # ---------------------------------------------------------------------
  # DigitalOcean filters outbound 25/465/587, so every send this bot has
  # ever attempted failed with "Network is unreachable" before the SMTP
  # dialogue even began. Left in place (and still honoured if enabled) for
  # any host that isn't blocked; use the HTTPS channels below on this one.
  #
  # The password formerly sat here in plaintext and was committed to git.
  # It has to be ROTATED at https://myaccount.google.com/apppasswords, and
  # if SMTP is ever re-enabled the new one belongs in the environment as
  # SMTP_PASSWORD - not in this file, which is public to anyone with the repo.
  email:
    enabled: false
    sender_email: "shahbazfarhan25@gmail.com"
    recipient_email: "shahbazfarhan25@gmail.com"
    smtp_server: "smtp.gmail.com"
    smtp_port: 587

  # ---------------------------------------------------------------------
  # Resend - email over HTTPS (port 443). Cannot be blocked here.
  # ---------------------------------------------------------------------
  # Setup: sign up at resend.com, create an API key, then on the Droplet
  #   echo 'RESEND_API_KEY=re_xxxxxxxx' >> /etc/market-bot.env
  # and flip enabled to true. NEVER put the key in this file.
  #
  # With no verified domain, Resend permits sending only FROM
  # onboarding@resend.dev TO the address the account was registered with -
  # which is exactly this use case, a report mailed to yourself. Verify a
  # domain only if the report ever needs to reach a second address.
  resend:
    enabled: true
    from: "onboarding@resend.dev"
    to: "shahbazfarhan25@gmail.com"

  # ---------------------------------------------------------------------
  # Pushover - phone push over HTTPS. The channel that actually matters.
  # ---------------------------------------------------------------------
  # Setup: get the User Key from the Pushover app, create an application
  # token at https://pushover.net/apps/build, then on the Droplet
  #   echo 'PUSHOVER_TOKEN=xxxx' >> /etc/market-bot.env
  #   echo 'PUSHOVER_USER=xxxx'  >> /etc/market-bot.env
  # and flip enabled to true.
  #
  # priority: -1 quiet, 0 normal, 1 bypasses quiet hours. Keep 0 for the
  # daily report; 1 is for alerts you want at 09:31 regardless.
  pushover:
    enabled: false
    priority: 0

  # ---------------------------------------------------------------------
  # When the report is sent
  # ---------------------------------------------------------------------
  # The full report (every closed trade, plus any positions still open) goes
  # out at each of these ET times, ON TOP OF the one sent the moment the last
  # position of the day closes. So a normal day produces three:
  #
  #   10:35  midday status - closed trades so far AND open positions, with
  #          unrealized P&L, MFE and MAE on each
  #   ~when all trades close - sent by finish_day, whenever that happens
  #   16:00  closing report
  #
  # If the session ends early (2026-08-20 finished at 10:14) the 10:35 and
  # 16:00 sends still fire from the idle loop, so an early finish does not
  # silently cost you two of the three.
  #
  # A 16:00 slot is NOT double-sent when the day ends by time-stop at 16:00 -
  # finish_day claims that slot as it fires.
  report_times: ["10:35", "16:00"]

  # A slot already this many minutes past when the process STARTS is recorded
  # as sent rather than fired, so restarting at 15:00 does not deliver a
  # "midday status" five hours late. A restart shortly after a slot still sends.
  report_catchup_minutes: 30

analytics:
  # Records EVERY entry signal that fires - taken or not - with the features
  # available at that moment, then follows each forward to see what the symbol
  # actually did. The skipped signals are the control group: without them,
  # "buy the best 3 of the 20 that fired" is an untestable claim.
  # Purely observational - written after the entry decision, never gates one.
  log_signals: true
  signal_log_file: "logs/signal_journal.csv"
  forward_return_minutes: [15, 30]
