trading:
  # --- Entry signal parameters ---
  # Entry decisions are made by watching each screened candidate's price DURING
  # the entry window below (not at one single instant anymore). If a symbol's
  # price rises by at least `rapid_increase_pct` within any trailing
  # `rapid_increase_lookback_minutes` window, it is bought.
  entry_window_start: "09:30"        # Start watching candidates for a rapid price rise (HH:MM ET)
  entry_window_end: "09:55"          # Stop looking for NEW entries after this time (HH:MM ET). Widened from 09:45.
  entry_check_interval_seconds: 60   # How often to re-check prices during the entry window, in seconds.
                                      # Kept at 60s (matches the 1-minute bar data we fetch) - polling faster
                                      # than that just re-reads the same bar and burns Alpaca's free-tier
                                      # data-request quota for no benefit.
  rapid_increase_pct: 0.5            # Minimum % price gain within the lookback window to trigger a buy (e.g. 0.5 = 0.5%)
  rapid_increase_lookback_minutes: 5 # Rolling window, in minutes, that the % gain above is measured over.
                                      # Widened from 2min: the free IEX feed lags wall-clock by ~2-3min, and the
                                      # lookback cutoff is computed against wall-clock time, so a window shorter
                                      # than the feed delay could never accumulate 2 in-window samples (see the
                                      # wall-clock-cutoff fix in run_entry_window in main.py).

  # --- RSI pre-filter ---
  # Computed once per candidate at symbol-selection time (market open); would
  # gate entries on RSI < rsi_max_for_entry. Disabled: on the sharp opening-range
  # breakouts this strategy targets, RSI often shoots up through 50-70 as PART
  # of the move itself, so requiring RSI < 50 was filtering out exactly the
  # kind of aggressive breakout being chased. Left in place (off) rather than
  # removed in case it's wanted again later.
  use_rsi_filter: false
  rsi_period: 14        # Standard RSI lookback, in daily bars
  rsi_max_for_entry: 50 # Only watch candidates with RSI below this for entry signals

  # --- Pullback entry ---
  # Instead of buying the instant a rapid increase is detected (which can mean
  # buying right into the top of the initial thrust, just before a normal
  # pullback), wait for price to pull back off the peak and then resume
  # upward before actually entering - aims for a better average entry price
  # and avoids buying the exact local top of the spike.
  use_pullback_entry: true
  pullback_min_pct: 0.1              # Min retracement from the post-thrust peak (%) to count as "a pullback started"
  pullback_max_giveback_fraction: 0.75 # Invalidate the setup if the pullback erases more than this fraction of the thrust's gain (failed breakout)
  resumption_confirm_pct: 0.05       # Min bounce off the pullback low (%) to confirm resumption and actually buy

  # volume_spike_multiplier: 1.5  # NOT CURRENTLY USED (kept here for reference).
  # The old entry check required a single 5-minute bar's volume to be >= 1.5x
  # a full TRADING DAY's average volume - a unit mismatch (5 minutes of volume
  # vs. ~390 minutes of average volume) that was almost never satisfiable.
  # Dropped in favor of the rapid_increase_* price-based check above.

  # --- Exit parameters ---
  # Checked in this priority order every exit-monitoring pass (~once per minute
  # live): final_exit > first_exit > momentum_fade > resistance > trailing_stop
  # > time_stop. The first one that fires wins for that pass.
  final_exit_loss_pct: -1.0    # Hard stop: sell ALL remaining shares if price falls this much from entry (%)
  first_exit_loss_pct: -0.5    # Scale-out: sell first_exit_pct of the position if price falls this much from entry (%)
  first_exit_pct: 0.33         # Fraction of the original position sold on the first_exit_loss_pct trigger above
  trailing_stop_pct: 0.75      # Trailing stop: exit ALL remaining shares if price falls this % below the
                                # HIGHEST price seen since entry (not below entry price - protects gains already made)
  time_stop_hour: 16           # Close all positions at this hour (ET) if nothing else has exited yet

  # Momentum fade: bails on a trade that's stalled (flat/negative trend) even
  # without a loss, rather than waiting for it to reverse into one.
  momentum_fade_hour: 10                 # Start checking momentum fade at this hour (ET)
  momentum_fade_minute: 15               # ...and this minute. Combined: 10:15 AM ET by default.
  momentum_fade_window_samples: 5        # Number of recent price samples used in the trend calc.
                                          # One sample is taken per exit-check pass (~once per minute
                                          # live), so 5 samples ~= the trend over the last ~4-5 minutes.
  momentum_fade_slope_threshold: 0.0001  # Trend is considered "faded" (and the position is closed)
                                          # when the regression slope ($ per sample) drops to or below this.

  # Resistance rejection: a "high, then two lower closes" pattern right at the
  # trade's peak is treated as a failed breakout and exits.
  resistance_lookback_samples: 3   # Number of recent price samples checked for the failed-breakout
                                    # pattern (oldest sample = peak, must strictly decline from there)

  # Position sizing
  max_position_per_stock_usd: 10000  # Max $ per stock
  max_daily_loss_usd: 1000  # Stop trading if daily loss exceeds this

  # Stock universe (can be dynamic or static)
  use_daily_screener: true  # Set to true to dynamically select stocks each day
  candidates_file: "candidates.txt"  # File with candidate symbols
  num_stocks_to_trade: 15  # Number of top stocks to select each day
  min_screener_score: 35  # Minimum score to trade (0-100)
  screener_timeout_seconds: 420  # 7 min hard cap on the screener. With ~50+ candidates,
                                  # each scored via several sequential API calls (including
                                  # a yfinance earnings lookup), the screener can run slow.
                                  # If it hasn't finished by this deadline, it's aborted and
                                  # the bot falls back to the static stock_universe list below
                                  # rather than eating into the entry window.

  # Default stock universe. Watched EVERY DAY no matter what - merged with
  # (not replaced by) whatever the daily screener additionally picks. Also
  # used directly when use_daily_screener is false, and as the fallback if
  # the screener errors, times out, or returns zero candidates.
  stock_universe:
    - "UBER"
    - "LYFT"
    - "ABNB"
    - "DASH"
    - "RBLX"
    - "PLTR"
    - "HOOD"
    - "COIN"
    - "SOFI"
    - "SNAP"
    - "ROKU"
    - "CVNA"
    - "RIVN"
    - "U"
    - "AFRM"
    - "UPST"
    - "MARA"
    - "RIOT"

  min_stock_price: 5
  max_stock_price: 300
  min_avg_volume: 1000000  # Minimum average daily volume

broker:
  paper_trading: true  # Set to false for live trading
  base_url: "https://paper-api.alpaca.markets"  # Paper trading endpoint

logging:
  level: "INFO"
  log_file: "logs/trading.log"

